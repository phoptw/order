        note.appendChild(iconEl('eyeView', 'ic-sm'));
        note.appendChild(document.createTextNode('檢視模式：狀態由 AC 更新'));
        card.appendChild(note);
        return card;
      }

      card.appendChild(el('div', 'divider'));

      // ---- 節點狀態變更區 ----
      card.appendChild(el('div', 'section-label', '更新節點狀態'));
      const picker = el('div', 'status-picker');
      picker.setAttribute('role', 'radiogroup');
      picker.setAttribute('aria-label', '節點狀態');
      const groupName = 'st-' + orderKey(o);
      STATUSES.forEach(function (s) {
        const opt = el('label', 'status-opt ' + sClass(s));
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = groupName;
        input.value = s;
        input.checked = s === o.status;
        opt.appendChild(input);
        const box = el('span', 'opt-box');
        const name = el('span', 'opt-name');
        name.appendChild(el('span', 'dot'));
        name.appendChild(document.createTextNode(label(s)));
        box.appendChild(name);
        box.appendChild(el('span', 'opt-hint', STATUS_HINT[s]));
        opt.appendChild(box);
        picker.appendChild(opt);
      });
      card.appendChild(picker);

      // 成交金額輸入:只有選到「已成交」才顯示
      const amount = el('div', 'amount');
      const amountLabel = el('label', 'section-label', '成交金額');
      const amountId = 'amt-' + orderKey(o);
      amountLabel.htmlFor = amountId;
      amount.appendChild(amountLabel);
      const amountWrap = el('div', 'amount-wrap');
      amountWrap.appendChild(el('span', 'amount-prefix', 'NT$'));
      const amountInput = document.createElement('input');
      amountInput.type = 'number';
      amountInput.id = amountId;
      amountInput.min = '0';
      amountInput.inputMode = 'numeric';
      amountInput.placeholder = '請輸入金額';
      if (o.status === STATUS_WON && o.dealAmount) amountInput.value = o.dealAmount;
      amountWrap.appendChild(amountInput);
      amount.appendChild(amountWrap);
      card.appendChild(amount);

      const saveRow = el('div', 'save-row');
      const saveBtn = el('button', 'btn btn-primary btn-block');
      saveRow.appendChild(saveBtn);
      card.appendChild(saveRow);

      function selected() {
        const checked = picker.querySelector('input:checked');
        return checked ? checked.value : o.status;
      }

      // 儲存中:整張卡片的選項跟金額都鎖住,避免改到一半又送出第二次、或回應回來重建卡片時把修改清掉
      let saving = false;
      function setSaving(on) {
        saving = on;
        picker.querySelectorAll('input').forEach(function (i) { i.disabled = on; });
        amountInput.disabled = on;
      }

      // 沒有變更就不能按儲存,避免誤觸;有變更時按鈕才亮起來
      function refreshDirty() {
        if (saving) return;
        const s = selected();
        amount.hidden = s !== STATUS_WON;
        const changed = s !== o.status || (s === STATUS_WON && amountInput.value.trim() !== String(o.dealAmount || ''));
        saveBtn.disabled = !changed;
        saveBtn.textContent = changed ? '儲存為「' + label(s) + '」' : '狀態未變更';
      }

      picker.addEventListener('change', function () {
        refreshDirty();
        if (selected() === STATUS_WON && !amountInput.value) amountInput.focus();
      });
      amountInput.addEventListener('input', refreshDirty);
      saveBtn.addEventListener('click', function () {
        if (saving) return;
        saveStatus(o, selected(), amountInput.value.trim(), saveBtn, setSaving, function onFail() {
          setSaving(false);
          refreshDirty();
        });
      });
      refreshDirty();

      return card;
    }

    function saveStatus(order, newStatus, amountValue, btn, setSaving, onFail) {
      if (newStatus === STATUS_WON) {
        const amt = Number(amountValue);
        if (!amountValue || isNaN(amt) || amt <= 0) {
          alert('選擇「已成交」時，請輸入有效的成交金額');
          return;
        }
      }

      setSaving(true);
      btn.disabled = true;
      btn.textContent = '儲存中…';

      // expected*:畫面上看到的舊值,後端發現試算表已被別人改過就不覆蓋
      gasCall('updateNodeStatus', {
        orderId: order.orderId, submitTimeKey: order.submitTimeKey, newStatus: newStatus, dealAmount: amountValue,
        expectedStatus: order.status, expectedAmount: order.status === STATUS_WON ? String(order.dealAmount || '') : ''
      })
        .then(function (res) {
          if (res && res.success) {
            // 採用後端實際存進試算表的值(含第一次成交的成交時間)
            order.status = res.status;
            order.dealAmount = res.dealAmount !== undefined ? res.dealAmount : (res.status === STATUS_WON ? amountValue : '');
            if (res.dealTime !== undefined) order.dealTime = res.dealTime;
            else if (res.status !== STATUS_WON) order.dealTime = '';
            btn.innerHTML = svg('check', 'ic-sm');
            btn.appendChild(document.createTextNode('已儲存'));
            btn.classList.add('is-saved');
            reportOrders = null; // 報表資料已過期,下次切到報表時重新讀取
            showToast((hasValue(order.customer) ? order.customer : order.storeName) + ' 已更新為「' + label(res.status) + '」');
            logAction('更新節點狀態', order.storeName + '(' + (order.customer || '') + ') → ' + res.status);
            const card = btn.closest('.card');
            setTimeout(function () { refreshSavedCard(order, card); }, 600);
          } else if (res && res.actual) {
            // 寫到一半出錯:卡片改成試算表的實際內容,不假裝什麼都沒改
            order.status = res.actual.status;
            order.dealAmount = res.actual.dealAmount;
            order.dealTime = res.actual.dealTime;
            reportOrders = null;
            alert('儲存失敗: ' + res.error + '\n試算表目前是「' + label(order.status) + '」' +
              (order.dealAmount ? '（NT$' + order.dealAmount + '）' : '') + '，卡片已改成這個狀態，請確認後再操作');
            refreshSavedCard(order, btn.closest('.card'));
          } else {
            alert('儲存失敗: ' + (res ? res.error : '未知錯誤'));
            onFail();
          }
        })
        .catch(function (err) {
          if (err && err.retryable) {
            // 逾時或斷線(已自動重試過):不確定有沒有存進去,重新讀取這位 AC 的訂單顯示實際狀態
            alert('儲存失敗: ' + err.message + '\n無法確認是否已儲存，清單會重新讀取，顯示目前的實際狀態');
            if (currentAc) loadOrders(currentAc);
            else onFail();
            return;
          }
          alert('儲存失敗: ' + err.message);
          onFail();
        });
    }

    function showToast(message) {
      const wrap = $('toast-wrap');
      const toast = el('div', 'toast');
      toast.appendChild(iconEl('check'));
      toast.appendChild(el('span', 'msg', message));
      wrap.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 250);
      }, 3000);
    }

    // =====================================================================
    // 報表(管理員 / RC)
    // =====================================================================
    function monthRange(offset) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      const end = new Date(now.getFullYear(), now.getMonth() + offset + 1, 1);
      return [start.getTime(), end.getTime(), start];
    }

    const PERIODS = [
      { key: 'all', name: '全部期間' },
      { key: 'last', name: '上個月', offset: -1 },
      { key: 'this', name: '本月', offset: 0 },
      { key: 'next', name: '下個月', offset: 1 }
    ];

    function renderPeriodChips() {
      const box = $('periodChips');
      box.innerHTML = '';
      PERIODS.forEach(function (p) {
        let text = p.name;
        if (p.offset !== undefined) text += '（' + (monthRange(p.offset)[2].getMonth() + 1) + '月）';
        const chip = el('button', 'chip' + (reportFilter.period === p.key ? ' active' : ''), text);
        chip.type = 'button';
        chip.addEventListener('click', function () {
          reportFilter.period = p.key;
          renderPeriodChips();
          renderReport();
        });
        box.appendChild(chip);
      });
    }

    function loadReport() {
      stale.report = false;
      setStatus('載入報表中…');
      if (reportOrders) {
        // 重新整理時保留舊畫面(變淡),不閃骨架
        $('reportBody').classList.add('is-stale');
      } else {
        showSkeleton('reportBody', 3);
      }
      renderPeriodChips();

      const fresh = latestOnly('report');
      function onReport(res) {
        $('reportBody').classList.remove('is-stale');
        if (!res || !res.success) {
          setStatus('載入失敗');
          showError('reportBody', res ? res.error : '後端回傳空值', loadReport);
          return;
        }
        reportOrders = res.orders || [];
        reportOps = res.ops || null;
        refreshMailBadge();
        markUpdated('report');
        rebuildRcFilter();
        rebuildAcFilter();
        renderReport();
      }
      // 登入時已經一起帶回來的報表:直接用(只用一次,之後按重新整理才重抓)
      if (initialReport) {
        const res = initialReport;
        initialReport = null;
        fresh(onReport)(res);
        return;
      }
      gasCall('getReport').then(fresh(onReport)).catch(fresh(function (err) {
        $('reportBody').classList.remove('is-stale');
        setStatus('載入失敗');
        showError('reportBody', err.message, loadReport);
      }));
    }

    function nameOrNone(v) {
      return v ? v : NONE_KEY;
    }

    function distinct(list) {
      const seen = {};
      return list.filter(function (v) {
        if (seen[v]) return false;
        seen[v] = true;
        return true;
      }).sort(function (a, b) {
        if (a === NONE_KEY) return 1;
        if (b === NONE_KEY) return -1;
        return a.localeCompare(b);
      });
    }

    function fillFilterSelect(select, allText, values, emptyText, current) {
      select.innerHTML = '';
      const all = el('option', null, allText);
      all.value = '';
      select.appendChild(all);
      values.forEach(function (v) {
        const opt = el('option', null, v === NONE_KEY ? emptyText : v);
        opt.value = v;
        select.appendChild(opt);
      });
      select.value = values.indexOf(current) !== -1 ? current : '';
    }

    function rebuildRcFilter() {
      const rcs = distinct(reportOrders.map(function (o) { return nameOrNone(o.rc); }));
      const show = role === 'admin' && rcs.some(function (r) { return r !== NONE_KEY; });
      $('rcFilter').hidden = !show;
      $('filterSelects').classList.toggle('two', show);
      if (!show) {
        reportFilter.rc = '';
        return;
      }
      fillFilterSelect($('rcFilter'), '全部 RC', rcs, '（未設定 RC）', reportFilter.rc);
      reportFilter.rc = $('rcFilter').value;
    }

    function rebuildAcFilter() {
      // AC 的報表只有自己,不需要 AC 篩選
      $('acFilter').hidden = role === 'ac';
      $('filterSelects').hidden = role === 'ac';
      if (role === 'ac') {
        reportFilter.ac = '';
        return;
      }
      const acs = distinct(reportOrders.filter(matchRc).map(function (o) { return nameOrNone(o.ac); }));
      fillFilterSelect($('acFilter'), '全部 AC', acs, '（未對應 AC）', reportFilter.ac);
      reportFilter.ac = $('acFilter').value;
    }

    function matchRc(o) {
      return !reportFilter.rc || nameOrNone(o.rc) === reportFilter.rc;
    }

    function inPeriod(o) {
      if (reportFilter.period === 'all') return true;
      const p = PERIODS.filter(function (x) { return x.key === reportFilter.period; })[0];
      if (!p || typeof o.diningDateKey !== 'number') return false;
      const r = monthRange(p.offset);
      return o.diningDateKey >= r[0] && o.diningDateKey < r[1];
    }

    function filteredReportOrders() {
      return (reportOrders || []).filter(function (o) {
        return inPeriod(o) && matchRc(o) && (!reportFilter.ac || nameOrNone(o.ac) === reportFilter.ac);
      });
    }

    function isAttention(o) {
      return OPEN_STATUSES.indexOf(o.status) !== -1 && typeof o.daysUntil === 'number' && o.daysUntil <= 2;
    }

    // 「拖太久」:跟每日待辦摘要副本給 RC 的條件一致
    // 尚未聯繫超過 2 天(從通知寄出算),或用餐日已過還沒結案
    const ESCALATE_HOURS = 48;
    function isEscalated(o) {
      if (OPEN_STATUSES.indexOf(o.status) === -1) return false;
      if (typeof o.daysUntil === 'number' && o.daysUntil < 0) return true;
      return o.status === STATUS_PENDING && typeof o.sentKey === 'number' && Date.now() - o.sentKey > ESCALATE_HOURS * 3600000;
    }

    function summarize(orders) {
      const s = { total: orders.length, counts: {}, amount: 0, attention: 0, escalated: 0 };
      STATUSES.forEach(function (st) { s.counts[st] = 0; });
      orders.forEach(function (o) {
        if (s.counts[o.status] !== undefined) s.counts[o.status]++;
        if (o.status === STATUS_WON) s.amount += Number(o.dealAmount) || 0;
        if (isAttention(o)) s.attention++;
        if (isEscalated(o)) s.escalated++;
      });
      s.won = s.counts[STATUS_WON];
      s.lost = s.counts[STATUS_LOST];
      s.open = s.counts[STATUS_PENDING] + s.counts[STATUS_NOT_ORDERED];
      return s;
    }

    // 依 keyFn 分組統計;sample 保留第一筆訂單(門市表要拿它的 AC)
    function aggregate(orders, keyFn) {
      const groups = {};
      const order = [];
      orders.forEach(function (o) {
        const k = keyFn(o);
        if (!groups[k]) {
          groups[k] = { key: k, orders: [], sample: o };
          order.push(k);
        }
        groups[k].orders.push(o);
      });
      return order.map(function (k) {
        const g = groups[k];
        const s = summarize(g.orders);
        s.key = k;
        s.sample = g.sample;
        s.rate = (s.won + s.lost) ? s.won / (s.won + s.lost) : null;
        return s;
      });
    }

    function renderReport() {
      if (!reportOrders) return;
      const body = $('reportBody');
      body.innerHTML = '';
      $('tooltip').hidden = true;
      const orders = filteredReportOrders();

      // 營運狀況是全公司的數字,不受篩選影響:就算這個範圍沒有訂單也要顯示
      if (role === 'admin' && reportOps) body.appendChild(buildOpsPanel(reportOps));

      if (!orders.length) {
        body.appendChild(stateEl('📭', '這個範圍沒有訂單', '換個期間或篩選條件試試'));
        return;
      }
      const sum = summarize(orders);
      body.appendChild(buildKpis(sum));
      body.appendChild(buildStatusPanel(sum));

      const attention = buildAttentionPanel(orders);
      if (attention) body.appendChild(attention);

      const months = aggregate(
        orders.filter(function (o) { return typeof o.diningDateKey === 'number'; }),
        function (o) {
          const d = new Date(o.diningDateKey);
          return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0');
        }
      ).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
      if (months.length >= 2) body.appendChild(buildMonthPanel(months));

      if (role === 'admin' && !reportFilter.rc && !$('rcFilter').hidden) {
        body.appendChild(buildTablePanel('rc', '各 RC 表現', aggregate(orders, function (o) { return nameOrNone(o.rc); }), {
          nameLabel: 'RC',
          emptyName: '（未設定 RC）',
          hint: '點一下只看該 RC',
          onClick: function (g) {
            reportFilter.rc = g.key;
            $('rcFilter').value = g.key;
            reportFilter.ac = '';
            rebuildAcFilter();
            renderReport();
            window.scrollTo(0, 0);
          }
        }));
      }

      if (!reportFilter.ac && role !== 'ac') {
        body.appendChild(buildTablePanel('ac', '各 AC 表現', aggregate(orders, function (o) { return nameOrNone(o.ac); }), {
          nameLabel: 'AC',
          emptyName: '（未對應 AC）',
          hint: '點一下查看該 AC 的訂單明細',
          onClick: function (g) { if (g.key !== NONE_KEY) openDetail(g.key, ''); }
        }));
      }

      const stores = aggregate(orders, function (o) { return o.storeName; });
      body.appendChild(buildTablePanel('store', '各門市表現', stores, {
        nameLabel: '門市',
        extra: role === 'ac' ? null : { label: 'AC', get: function (g) { return g.sample.ac || '—'; } },
        hint: '點一下查看該門市的訂單',
        limit: showAllStores ? 0 : 10,
        onClick: function (g) { if (g.sample.ac) openDetail(g.sample.ac, g.key); }
      }));

      body.appendChild(el('p', 'footnote',
        '統計範圍：已寄出通知、已分配門市的訂單；期間依「用餐日期」篩選。' +
        '成交率 ＝ 已成交 ÷（已成交＋已流失），只計算已結案的訂單。' +
        '「需注意」＝ 尚未聯繫或待下單、且用餐日在 2 天內（含已過）。' +
        '「拖太久」＝ 通知寄出超過 2 天還沒聯繫，或用餐日已過仍未結案；每日待辦摘要會把這些訂單副本給 RC。'));
    }

    function kpi(labelText, value, sub, opts) {
      const box = el('div', 'kpi' + (opts && opts.warn ? ' warn' : ''));
      const lab = el('div', 'kpi-label');
      if (opts && opts.icon) lab.appendChild(iconEl(opts.icon, 'ic-sm'));
      lab.appendChild(document.createTextNode(labelText));
      box.appendChild(lab);
      box.appendChild(el('div', 'kpi-value', value));
      box.appendChild(el('div', 'kpi-sub', sub));
      return box;
    }

    // 營運狀況的卡片:點一下打開寄信助手的對應分頁
    function linkKpi(box, tab, hint) {
      const btn = el('button', box.className + ' kpi-link');
      btn.type = 'button';
      while (box.firstChild) btn.appendChild(box.firstChild);
      btn.appendChild(iconEl('chevronRight', 'kpi-go'));
      btn.setAttribute('aria-label', btn.textContent + '・' + hint);
      btn.title = hint;
      btn.addEventListener('click', function () {
        switchMailTab(tab);
        setView('mail');
      });
      return btn;
    }

    // 管理員「營運狀況」:待寄送 / 待分配 / 今天的每日待辦摘要寄送結果(全公司,不受上方篩選影響)
    function buildOpsPanel(ops) {
      const p = panel('營運狀況', '全公司・點卡片進寄信助手');
      const grid = el('div', 'kpis');
      grid.appendChild(linkKpi(kpi('待寄送通知', ops.pending === null ? '—' : ops.pending,
        ops.pendingOverdue ? ops.pendingOverdue + ' 筆超過 24 小時' : '還沒寄給門市', { warn: ops.pendingOverdue > 0 }), 'pending', '打開待寄送'));
      grid.appendChild(linkKpi(kpi('待分配門市', ops.unassigned === null ? '—' : ops.unassigned, '還沒指派門市', { warn: ops.unassigned > 0 }), 'unassigned', '打開待分配門市'));
      const d = ops.lastDigest;
      grid.appendChild(kpi('每日待辦摘要', d ? '已寄 ' + d.sentCount + ' 位' : '尚無紀錄',
        d ? '最近一次：' + d.time : '設定排程後每天 9:00 寄出', { warn: !!(d && d.notSent.length) }));
      p.appendChild(grid);

      if (d && d.notSent.length) {
        const warn = el('div', 'ops-warn');
        warn.appendChild(el('strong', null, '未寄出 ' + d.notSent.length + ' 位'));
        d.notSent.forEach(function (s) { warn.appendChild(el('div', null, '・' + s)); });
        p.appendChild(warn);
      }

      return p;
    }

    function buildKpis(s) {
      const box = el('section', 'kpis');
      box.setAttribute('aria-label', '重點數字');
      box.appendChild(kpi('訂單數', s.total.toLocaleString('zh-TW'), '處理中 ' + s.open + ' 筆'));
      box.appendChild(kpi('成交金額', formatMoney(s.amount), s.won ? s.won + ' 筆成交' : '尚無成交'));
      box.appendChild(kpi('成交率', pct(s.won, s.won + s.lost), '已結案 ' + (s.won + s.lost) + ' 筆'));
      box.appendChild(kpi('平均成交金額', s.won ? formatMoney(s.amount / s.won) : '—', '每筆成交訂單'));
      box.appendChild(kpi('拖太久', s.escalated, '未聯繫超過 2 天或用餐日已過', { warn: s.escalated > 0, icon: 'clock' }));
      box.appendChild(kpi('需注意', s.attention, '2 天內用餐仍未成交', { warn: s.attention > 0, icon: 'alert' }));
      return box;
    }

    function panel(title, sub) {
      const p = el('section', 'panel');
      const head = el('div', 'panel-head');
      head.appendChild(el('h2', 'panel-title', title));
      if (sub) head.appendChild(el('span', 'panel-sub', sub));
      p.appendChild(head);
      return p;
    }

    // 一條 100% 堆疊長條 + 每段 tooltip
    function stackBar(counts, total, mini, tipPrefix) {
      const bar = el('div', 'stackbar' + (mini ? ' mini' : ''));
      bar.setAttribute('role', 'img');
      bar.setAttribute('aria-label', STATUSES.map(function (s) { return label(s) + ' ' + (counts[s] || 0); }).join('、'));
      STATUSES.forEach(function (s) {
        const n = counts[s] || 0;
        if (!n) return;
        const seg = el('div', 'seg ' + sClass(s));
        seg.style.flexGrow = n;
        seg.dataset.tip = (tipPrefix ? tipPrefix + '・' : '') + label(s) + ' ' + n + ' 筆（' + pct(n, total) + '）';
        bar.appendChild(seg);
      });
      return bar;
    }

    function legend(counts, total) {
      const box = el('div', 'legend');
      STATUSES.forEach(function (s) {
        const item = el('div', 'legend-item ' + sClass(s));
        item.appendChild(el('span', 'swatch'));
        item.appendChild(el('span', null, label(s)));
        if (counts) {
          item.appendChild(el('span', 'legend-num', counts[s] || 0));
          item.appendChild(el('span', 'legend-pct', pct(counts[s] || 0, total)));
        }
        box.appendChild(item);
      });
      return box;
    }

    function buildStatusPanel(s) {
      const p = panel('狀態分布', '共 ' + s.total + ' 筆');
      p.appendChild(stackBar(s.counts, s.total, false, ''));
      p.appendChild(legend(s.counts, s.total));
      return p;
    }

    function buildAttentionPanel(orders) {
      const items = orders.filter(isAttention).sort(byDiningDate);
      if (!items.length) return null;
      const p = panel('需要注意', items.length + ' 筆用餐日 2 天內（或已過）仍未成交');
      const list = el('div', 'attn-list');
      items.slice(0, 8).forEach(function (o) {
        const btn = el('button', 'attn-item');
        btn.type = 'button';
        const main = el('div', 'attn-main');
        const hasCustomer = hasValue(o.customer);
        main.appendChild(el('div', 'attn-title', hasCustomer ? o.customer : o.storeName));
        main.appendChild(el('div', 'attn-sub', (hasCustomer ? o.storeName + '・' : '') + (o.ac || '未對應 AC') + (o.diningDate ? '・' + o.diningDate : '')));
        btn.appendChild(main);
        const side = el('div', 'attn-side');
        side.appendChild(statusPill(o.status));
        const due = dueTag(o);
        if (due) side.appendChild(due);
        btn.appendChild(side);
        btn.addEventListener('click', function () {
          if (o.ac) openDetail(o.ac, hasValue(o.customer) ? o.customer : o.storeName);
        });
        list.appendChild(btn);
      });
      p.appendChild(list);
      if (items.length > 8) {
        p.appendChild(el('p', 'footnote', '還有 ' + (items.length - 8) + ' 筆，可在下方表格點進各 AC 查看。'));
      }
      return p;
    }

    function buildMonthPanel(months) {
      const p = panel('依用餐月份', '每月訂單數與狀態');
      const PLOT_H = 140;
      const max = Math.max.apply(null, months.map(function (m) { return m.total; }));
      const scroll = el('div', 'cols-scroll');
      const cols = el('div', 'cols');
      let lastYear = '';
      months.forEach(function (m) {
        const y = m.key.slice(0, 4);
        const mo = Number(m.key.slice(5));
        const col = el('div', 'col');
        col.appendChild(el('div', 'col-total', m.total));
        const stack = el('div', 'col-stack');
        stack.style.height = Math.max(4, Math.round(m.total / max * PLOT_H)) + 'px';
        STATUSES.forEach(function (s) {
          const n = m.counts[s] || 0;
          if (!n) return;
          const seg = el('div', 'seg ' + sClass(s));
          seg.style.flexGrow = n;
          seg.dataset.tip = y + '/' + mo + '月・' + label(s) + ' ' + n + ' 筆';
          stack.appendChild(seg);
        });
        col.appendChild(stack);
        const axis = el('div', 'col-axis', mo + '月');
        if (y !== lastYear) axis.appendChild(el('small', null, y));
        lastYear = y;
        col.appendChild(axis);
        cols.appendChild(col);
      });
      scroll.appendChild(cols);
      p.appendChild(scroll);
      p.appendChild(legend(null, 0));

      // 數字表(圖表的文字版)
      const details = el('details', 'numbers');
      details.appendChild(el('summary', null, '查看數字表'));
      const wrap = el('div', 'tbl-wrap');
      const table = el('table', 'tbl');
      const thead = el('thead');
      const hr = el('tr');
      ['月份', '訂單'].concat(STATUSES.map(label)).concat(['成交金額']).forEach(function (h) { hr.appendChild(el('th', null, h)); });
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = el('tbody');
      months.forEach(function (m) {
        const tr = el('tr');
        tr.appendChild(el('td', null, m.key));
        tr.appendChild(el('td', null, m.total));
        STATUSES.forEach(function (s) { tr.appendChild(el('td', null, m.counts[s] || 0)); });
        tr.appendChild(el('td', null, m.amount ? formatMoney(m.amount) : '—'));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      details.appendChild(wrap);
      p.appendChild(details);
      return p;
    }

    // 可排序的統計表:名稱 / (額外欄) / 訂單 / 分布 / 四個狀態 / 成交率 / 成交金額
    function buildTablePanel(id, title, groups, opts) {
      const sort = tableSort[id] || { key: 'total', dir: -1 };
      const valueOf = {
        name: function (g) { return g.key === NONE_KEY ? '￿' : g.key; },
        total: function (g) { return g.total; },
        rate: function (g) { return g.rate === null ? -1 : g.rate; },
        amount: function (g) { return g.amount; },
        escalated: function (g) { return g.escalated; }
      };
      STATUSES.forEach(function (s) { valueOf['s:' + s] = function (g) { return g.counts[s] || 0; }; });

      const rows = groups.slice().sort(function (a, b) {
        const va = valueOf[sort.key](a);
        const vb = valueOf[sort.key](b);
        if (typeof va === 'string') return va.localeCompare(vb) * sort.dir;
        if (va !== vb) return (va - vb) * sort.dir;
        return b.total - a.total;
      });

      const p = panel(title, groups.length + (id === 'store' ? ' 間' : ' 位') + (opts.hint ? '・' + opts.hint : ''));
      const wrap = el('div', 'tbl-wrap');
      const table = el('table', 'tbl');
      const thead = el('thead');
      const hr = el('tr');

      function th(text, key) {
        const cell = el('th');
        if (!key) {
          cell.textContent = text;
          return cell;
        }
        const b = el('button');
        b.type = 'button';
        b.textContent = text;
        if (sort.key === key) {
          cell.setAttribute('aria-sort', sort.dir === -1 ? 'descending' : 'ascending');
          b.appendChild(document.createTextNode(sort.dir === -1 ? ' ↓' : ' ↑'));
        }
        b.addEventListener('click', function () {
          tableSort[id] = { key: key, dir: sort.key === key ? -sort.dir : (key === 'name' ? 1 : -1) };
          renderReport();
        });
        cell.appendChild(b);
        return cell;
      }

      hr.appendChild(th(opts.nameLabel, 'name'));
      if (opts.extra) hr.appendChild(th(opts.extra.label));
      hr.appendChild(th('訂單', 'total'));
      hr.appendChild(th('狀態分布'));
      STATUSES.forEach(function (s) { hr.appendChild(th(label(s), 's:' + s)); });
      hr.appendChild(th('拖太久', 'escalated'));
      hr.appendChild(th('成交率', 'rate'));
      hr.appendChild(th('成交金額', 'amount'));
      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = el('tbody');
      const shown = opts.limit ? rows.slice(0, opts.limit) : rows;
      shown.forEach(function (g) {
        const tr = el('tr', opts.onClick ? 'clickable' : '');
        const name = g.key === NONE_KEY ? (opts.emptyName || '—') : g.key;
        tr.appendChild(el('td', 'name-cell' + (g.key === NONE_KEY ? ' muted' : ''), name));
        if (opts.extra) tr.appendChild(el('td', 'left muted', opts.extra.get(g)));
        tr.appendChild(el('td', null, g.total));
        const distCell = el('td');
        distCell.appendChild(stackBar(g.counts, g.total, true, name));
        tr.appendChild(distCell);
        STATUSES.forEach(function (s) {
          const n = g.counts[s] || 0;
          tr.appendChild(el('td', n ? '' : 'muted', n));
        });
        tr.appendChild(el('td', g.escalated ? 'warn-num' : 'muted', g.escalated));
        tr.appendChild(el('td', g.rate === null ? 'muted' : '', g.rate === null ? '—' : Math.round(g.rate * 100) + '%'));
        tr.appendChild(el('td', g.amount ? '' : 'muted', g.amount ? formatMoney(g.amount) : '—'));
        if (opts.onClick) {
          tr.tabIndex = 0;
          tr.addEventListener('click', function () { opts.onClick(g); });
          tr.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              opts.onClick(g);
            }
          });
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      p.appendChild(wrap);

      if (opts.limit && rows.length > opts.limit) {
        const more = el('button', 'btn btn-secondary btn-small tbl-more', '顯示全部 ' + rows.length + ' 間');
        more.type = 'button';
        more.addEventListener('click', function () {
          showAllStores = true;
          renderReport();
        });
        p.appendChild(more);
      } else if (id === 'store' && showAllStores && rows.length > 10) {
        const less = el('button', 'btn btn-secondary btn-small tbl-more', '只顯示前 10 間');
        less.type = 'button';
        less.addEventListener('click', function () {
          showAllStores = false;
          renderReport();
        });
        p.appendChild(less);
      }
      return p;
    }

    // =====================================================================
    // 寄信助手(管理員):待寄送通知 / 待分配門市
    // =====================================================================
    // 逾時未寄送門檻:超過此時數視為逾期
    const OVERDUE_MS = 24 * 60 * 60 * 1000;
    const UNDO_MS = 5000;

    let mailLoaded = false;
    let mailOrders = [];
    let unassignedOrders = [];
    let storeNameOptions = [];
    let mailFilter = 'all';    // 'all' | 'missing' | 'overdue'
    let mailTab = 'pending';   // 'pending' | 'unassigned'
    let unassignedHasNearest = false; // 目前的待分配清單是否已算好最近門市
    let unassignedBusy = false;
    let mailLoadingTimeout;
    let unassignedLoadingTimeout;
    const mailCounts = { pending: null, unassigned: null };

    $('mailSearch').addEventListener('input', applyMailFilters);

    $('mailChipRow').addEventListener('click', function (e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#mailChipRow .chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
      mailFilter = chip.dataset.filter;
      applyMailFilters();
    });

    $('mailTabRow').addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (btn) switchMailTab(btn.dataset.tab);
    });

    function switchMailTab(tab) {
      mailTab = tab;
      document.querySelectorAll('#mailTabRow .seg-btn').forEach(function (b) {
        const on = b.dataset.tab === tab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const isPending = tab === 'pending';
      $('mailPendingControls').hidden = !isPending;
      $('mailList').hidden = !isPending;
      $('unassignedList').hidden = isPending;
      updateBulkBar();
      window.scrollTo(0, 0);
      // 第一次打開「待分配門市」才查最近門市
      if (!isPending && mailLoaded && !unassignedHasNearest && !unassignedBusy) loadUnassigned();
    }

    function resetMail() {
      mailLoaded = false;
      mailOrders = [];
      unassignedOrders = [];
      unassignedHasNearest = false;
      unassignedBusy = false;
      mailCounts.pending = null;
      mailCounts.unassigned = null;
      clearTimeout(mailLoadingTimeout);
      clearTimeout(unassignedLoadingTimeout);
      mailFilter = 'all';
      $('mailSearch').value = '';
      document.querySelectorAll('#mailChipRow .chip').forEach(function (c) { c.classList.toggle('active', c.dataset.filter === 'all'); });
      switchMailTab('pending');
      refreshMailBadge();
    }

    // 「寄信助手」分頁上的數字:讀過寄信助手用最新數字,否則用報表營運狀況的數字
    function refreshMailBadge() {
      let n = null;
      if (mailCounts.pending !== null && mailCounts.unassigned !== null) {
        n = mailCounts.pending + mailCounts.unassigned;
      } else if (reportOps && typeof reportOps.pending === 'number' && typeof reportOps.unassigned === 'number') {
        n = reportOps.pending + reportOps.unassigned;
      }
      $('mailViewCount').textContent = n || '';
      $('mailViewCount').hidden = !n;
    }

    function setPendingTabCount(n) {
      mailCounts.pending = n;
      $('pendingTabCount').textContent = n === null ? '—' : n;
      refreshMailBadge();
    }

    function setUnassignedTabCount(n) {
      mailCounts.unassigned = n;
      $('unassignedTabCount').textContent = n === null ? '—' : n;
      refreshMailBadge();
    }

    function setMailStatus(msg) {
      if (view === 'mail') setStatus(msg);
    }

    function loadMail() {
      mailLoaded = true;
      stale.mail = false;
      loadPending();
      loadUnassigned();
    }

    function timeAgo(ms) {
      if (typeof ms !== 'number') return '';
      const min = Math.floor((Date.now() - ms) / 60000);
      if (min < 1) return '剛剛';
      if (min < 60) return min + ' 分鐘前';
      const h = Math.floor(min / 60);
      if (h < 24) return h + ' 小時前';
      return Math.floor(h / 24) + ' 天前';
    }

    // 寫入時告訴後端是哪一筆:訂單編號優先(填寫時間只當作備用)
    // 畫面上分辨訂單一律用訂單編號(沒有編號時才退回填寫時間),不用試算表的列號:
    // 列號會因為排序、刪列而改變,而且「尚未處理信件」的列號跟 worksheet 的列號根本不同
    function orderKey(o) {
      return String(o.orderId || ('t' + o.submitTimeKey)).replace(/[^\w-]/g, '_');
    }

    // 卡片標題 / 錯誤訊息裡的名稱:顧客名 → 訂單編號
    function orderLabel(o) {
      return hasValue(o.customer) ? o.customer : (o.orderId ? '訂單 ' + o.orderId : '（顧客未提供）');
    }

    function orderRef(order) {
      return { orderId: order.orderId, submitTimeKey: order.submitTimeKey };
    }

    function isOverdue(order) {
      return typeof order.submitTimeKey === 'number' && (Date.now() - order.submitTimeKey) > OVERDUE_MS;
    }

    // 依填寫時間由舊到新排序,舊訂單優先處理;無法解析時間的排最後
    function sortBySubmit(orders) {
      return orders.slice().sort(function (a, b) {
        const ta = typeof a.submitTimeKey === 'number' ? a.submitTimeKey : Infinity;
        const tb = typeof b.submitTimeKey === 'number' ? b.submitTimeKey : Infinity;
        return ta - tb;
      });
    }

    // 填寫時間那一行;標題已經是訂單編號(沒有顧客名)時,這裡就不再重複編號
    function submitLine(o, titleIsId) {
      const sub = el('div', 'card-sub');
      sub.appendChild(iconEl('clock', 'ic-sm'));
      const ago = timeAgo(o.submitTimeKey);
      sub.appendChild(document.createTextNode((o.orderId && !titleIsId ? o.orderId + '・' : '') + '填寫於 ' + (o.submitTimeDisplay || '未知') + (ago ? '・' + ago : '')));
      return sub;
    }

    // 標記完成或撤銷後,報表的營運狀況/訂單都變了,下次切到報表時重新讀取
    function invalidateReport() {
      reportOrders = null;
    }

    // ----- 寫入序號 -----
    // 清單查詢回來時,排除「這次查詢送出後」才在這個畫面移出該清單的訂單:
    // 查詢可能在寫入前就讀到資料庫,較晚回來的舊資料不能把剛標記 / 退回 / 指派的訂單放回去。
    // 查詢送出前就移出的不排除(之後如果又被別人移回來,新查詢要看得到)
    let writeSeq = 0;
    const movedOutAt = { pending: {}, unassigned: {} };
    function noteMovedOut(listName, order) {
      writeSeq++;
      movedOutAt[listName][orderKey(order)] = writeSeq;
    }
    function noteMovedIn(listName, order) {
      delete movedOutAt[listName][orderKey(order)];
    }
    function notMovedSince(listName, startSeq) {
      return function (o) { return !(movedOutAt[listName][orderKey(o)] > startSeq); };
    }
    // 卡片可能已經因為清單重新讀取換成新的一張:用訂單找畫面上現在那張
    function liveCard(card) {
      return (card.id && document.getElementById(card.id)) || card;
    }

    // ----- 待寄送通知 -----
    function loadPending() {
      setMailStatus('載入中…');
      showSkeleton('mailList');
      clearTimeout(mailLoadingTimeout);
      mailLoadingTimeout = setTimeout(function () {
        setMailStatus('已等待超過 10 秒，仍在等待回應…');
      }, 10000);

      const fresh = latestOnly('pending');
      const startSeq = writeSeq;
      gasCall('getPendingOrders').then(fresh(function (result) {
        clearTimeout(mailLoadingTimeout);
        if (!result || !result.success) {
          onPendingError({ message: result ? result.error : '後端回傳空值' });
          return;
        }
        markUpdated('mail');
        mailOrders = sortBySubmit((result.orders || []).filter(notMovedSince('pending', startSeq)));
        setPendingTabCount(mailOrders.length);
        applyMailFilters();
      })).catch(fresh(onPendingError));
    }

    function onPendingError(err) {
      clearTimeout(mailLoadingTimeout);
      setMailStatus('載入失敗');
      setPendingTabCount(null);
      showError('mailList', err && err.message ? err.message : JSON.stringify(err), loadPending);
    }

    function updateChipCounts() {
      $('chipAll').textContent = mailOrders.length;
      $('chipMissing').textContent = mailOrders.filter(function (o) { return o.missingInfo; }).length;
      $('chipOverdue').textContent = mailOrders.filter(isOverdue).length;
    }

    // 結合「搜尋文字」跟「篩選標籤(全部/需確認/逾期)」兩個條件,一起套用後重新渲染
    function applyMailFilters() {
      const keyword = $('mailSearch').value.trim().toLowerCase();
      let result = mailOrders;
      if (mailFilter === 'missing') {
        result = result.filter(function (o) { return o.missingInfo; });
      } else if (mailFilter === 'overdue') {
        result = result.filter(isOverdue);
      }
      if (keyword) {
        result = result.filter(function (o) { return (o.storeName || '').toLowerCase().indexOf(keyword) !== -1; });
      }
      updateChipCounts();
      renderMailList(result, !!keyword || mailFilter !== 'all');
    }

    function renderMailList(orders, filtered) {
      const list = $('mailList');
      list.innerHTML = '';
      if (!orders.length) {
        if (filtered) showState('mailList', '🔍', '沒有符合條件的訂單', '換個關鍵字或篩選條件試試');
        else showState('mailList', '🎉', '目前沒有待寄送的訂單', '全部處理完了！');
        return;
      }
      orders.forEach(function (o) { list.appendChild(buildPendingCard(o)); });
    }

    // 標記完成當下就把該筆從「待處理」計數中移除(不等卡片淡出動畫跑完)
    // 用訂單比對(清單可能已重新讀取,物件換成新的)
    function removeMailOrder(order) {
      const k = orderKey(order);
      mailOrders = mailOrders.filter(function (o) { return orderKey(o) !== k; });
      setPendingTabCount(mailOrders.length);
      updateChipCounts();
    }

    // 撤銷時把該筆加回待處理計數
    function restoreMailOrder(order) {
      const k = orderKey(order);
      if (!mailOrders.some(function (o) { return orderKey(o) === k; })) {
        mailOrders.push(order);
        mailOrders = sortBySubmit(mailOrders);
      }
      setPendingTabCount(mailOrders.length);
      updateChipCounts();
    }

    function buildPendingCard(o) {
      const overdue = isOverdue(o);
      const card = el('article', 'card' + (o.missingInfo ? ' is-missing' : (overdue ? ' is-overdue' : '')));
      card.id = 'mail-' + orderKey(o);

      const head = el('div', 'card-head');
      head.appendChild(el('h3', 'card-title', o.storeName));
      const badges = el('div', 'badges');
      if (overdue) badges.appendChild(el('span', 'badge late', '逾期'));
      badges.appendChild(el('span', 'badge ' + (o.missingInfo ? 'warn' : 'ok'), o.missingInfo ? '需確認' : '資料完整'));
      head.appendChild(badges);
      card.appendChild(head);
      card.appendChild(submitLine(o));

      if (o.missingInfo) {
        const warn = el('div', 'alert late');
        warn.appendChild(iconEl('alert', 'ic-sm'));
        warn.appendChild(el('span', null, '找不到完整門市對應資料，請人工確認收件人信箱'));
        card.appendChild(warn);
      }

      // 後端對不到唯一的訂單編號(例如兩筆同一秒填寫):不能標記,避免標錯筆
      const noId = 'orderId' in o && !o.orderId;
      if (noId) {
        const warn = el('div', 'alert late');
        warn.appendChild(iconEl('alert', 'ic-sm'));
        warn.appendChild(el('span', null, (o.orderIdNote || '找不到對應的訂單編號') + '，無法在這裡標記完成，請到試算表處理'));
        card.appendChild(warn);
      }

      const actions = el('div', 'actions');
      // 主要動作:開啟 Outlook 寄信
      const outlookBtn = el('button', 'btn btn-primary btn-block');
      outlookBtn.appendChild(iconEl('mail'));
      outlookBtn.appendChild(document.createTextNode('在 Outlook 開啟'));
      outlookBtn.addEventListener('click', function () { openInOutlook(o); });
      actions.appendChild(outlookBtn);

      // 次要動作:確認已寄送
      const doneBtn = el('button', 'btn btn-secondary btn-block');
      setDoneLabel(doneBtn, 'idle');
      doneBtn.addEventListener('click', function () { markDone(o, doneBtn, outlookBtn, card); });
      doneBtn.disabled = noId;
      actions.appendChild(doneBtn);

      // 指派錯門市:退回「待分配門市」重新選(只有還沒寄出的才能退)
      const backBtn = el('button', 'btn btn-secondary btn-small btn-block unassign-btn');
      backBtn.type = 'button';
      setUnassignLabel(backBtn, false);
      backBtn.disabled = noId;
      backBtn.addEventListener('click', function () { unassignPending(o, backBtn, [outlookBtn, doneBtn], card); });
      actions.appendChild(backBtn);
      card.appendChild(actions);

      // 信件詳細內容(收件人/副本/主旨/內文)預設收合,需要時再展開查看或複製
      const details = el('details', 'mail');
      const summary = el('summary');
      summary.appendChild(el('span', null, '信件內容（收件人、副本、主旨、內文）'));
      summary.appendChild(iconEl('chevron'));
      details.appendChild(summary);
      details.appendChild(makeField('收件人 To', o.to || '', false));
      details.appendChild(makeField('副本 CC', o.cc || '', false));
      details.appendChild(makeField('主旨', o.subject || '', false));
      details.appendChild(makeField('內文', o.body || '', true));
      card.appendChild(details);
      return card;
    }

    function makeField(labelText, value, multiline) {
      const wrap = el('div', 'field');
      const head = el('div', 'field-head');
      head.appendChild(el('span', 'field-label', labelText));
      const field = document.createElement(multiline ? 'textarea' : 'input');
      if (!multiline) field.type = 'text';
      field.readOnly = true;
      field.value = value;
      field.setAttribute('aria-label', labelText);
      const btn = el('button', 'copy-btn');
      btn.type = 'button';
      setCopyLabel(btn, false);
      btn.addEventListener('click', function () { copyField(field, btn); });
      head.appendChild(btn);
      wrap.appendChild(head);
      wrap.appendChild(field);
      return wrap;
    }

    function setCopyLabel(btn, copied) {
      btn.innerHTML = svg(copied ? 'check' : 'copy', 'ic-sm');
      btn.appendChild(document.createTextNode(copied ? '已複製' : '複製'));
      btn.classList.toggle('copied', copied);
    }

    // 優先使用現代 Clipboard API,不支援時(例如非 https 環境)退回 execCommand
    function copyField(field, btn) {
      const finish = function (ok) {
        if (ok) setCopyLabel(btn, true);
        else btn.textContent = '複製失敗';
        setTimeout(function () { setCopyLabel(btn, false); }, 1300);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(field.value).then(
          function () { finish(true); },
          function () { finish(legacyCopy_(field)); }
        );
      } else {
        finish(legacyCopy_(field));
      }
    }

    function legacyCopy_(field) {
      try {
        field.select();
        field.setSelectionRange(0, 999999);
        return document.execCommand('copy');
      } catch (e) {
        return false;
      }
    }

    // 複製一段純文字(沒有輸入框可選取時,暫時建一個隱藏的輸入框來複製)
    function copyText(text, btn) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.readOnly = true;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      temp.style.pointerEvents = 'none';
      document.body.appendChild(temp);
      copyField(temp, btn);
      setTimeout(function () { temp.remove(); }, 1500);
    }

    // 用暫時建立的 <a> 標籤觸發外部 App(郵件 / 地圖),在手機瀏覽器裡比 window.open 穩定
    function openExternal(url) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_top';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 用 mailto 連結呼叫預設郵件軟體(Outlook)並帶入 To/CC/主旨/內文;使用者仍需自行按下傳送
    function openInOutlook(order) {
      const params = 'cc=' + encodeURIComponent(order.cc || '') +
        '&subject=' + encodeURIComponent(order.subject || '') +
        '&body=' + encodeURIComponent(order.body || '');
      openExternal('mailto:' + encodeURIComponent(order.to || '') + '?' + params);
    }

    function setDoneLabel(btn, state) {
      btn.classList.toggle('is-done', state === 'done');
      if (state === 'busy') {
        btn.textContent = '處理中…';
        return;
      }
      btn.innerHTML = svg('check');
      btn.appendChild(document.createTextNode(state === 'done' ? '已標記完成' : '已寄送，標記完成'));
    }

    function removeCard(card, listId, emptyFn) {
      card.classList.add('removing');
      setTimeout(function () {
        card.remove();
        if ($(listId).children.length === 0) emptyFn();
      }, 380);
    }

    // 顯示可撤銷的 toast(底部有倒數條);倒數結束才真正把卡片移除
    function showUndoToast(message, onUndo, onExpire, durationMs) {
      const wrap = $('toast-wrap');
      const toast = el('div', 'toast');
      toast.appendChild(iconEl('check'));
      toast.appendChild(el('span', 'msg', message));
      const undoBtn = el('button', 'undo-btn', '撤銷');
      toast.appendChild(undoBtn);
      const bar = el('div', 'toast-bar');
      bar.style.animationDuration = durationMs + 'ms';
      toast.appendChild(bar);
      wrap.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });

      let done = false;
      const timer = setTimeout(function () {
        if (done) return;
        done = true;
        dismiss();
        onExpire();
      }, durationMs);

      function dismiss() {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 250);
      }

      undoBtn.addEventListener('click', function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        dismiss();
        onUndo();
      });
    }

    function markDone(order, btn, outlookBtn, card) {
      // 標記中、撤銷倒數中都不能退回待分配(撤銷成功或標記失敗才恢復)
      const backBtn = card.querySelector('.unassign-btn');
      btn.disabled = true;
      outlookBtn.disabled = true;
      if (backBtn) backBtn.disabled = true;
      setDoneLabel(btn, 'busy');

      function resetButtons() {
        btn.disabled = false;
        outlookBtn.disabled = false;
        if (backBtn) backBtn.disabled = false;
        card.classList.remove('is-done');
        setDoneLabel(btn, 'idle');
      }

      // 這次按下的代碼:逾時自動重試時帶同一個,後端才知道是同一次操作
      const markToken = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      gasCall('markAsSent', Object.assign({ markToken: markToken, storeName: order.storeName }, orderRef(order)))
        .then(function (res) {
          if (!res || !res.success) {
            alert('標記失敗: ' + (res ? res.error : '未知錯誤'));
            resetButtons();
            return;
          }
          setDoneLabel(btn, 'done');
          card.classList.add('is-done');
          noteMovedOut('pending', order);
          removeMailOrder(order);
          invalidateReport();

          // 別人(或另一個分頁)之前就標記過:保留原本的時間,不提供撤銷
          if (res.alreadySent) {
            showToast(order.storeName + ' 之前已標記過（' + res.operationTime + '），時間未變更');
            setTimeout(function () { removeCard(liveCard(card), 'mailList', applyMailFilters); }, 1200);
            return;
          }

          // 給 5 秒的撤銷時間,期間卡片先留在畫面上(變淡)
          showUndoToast(
            order.storeName + ' 已標記完成',
            function onUndo() {
              setDoneLabel(btn, 'busy');
              // 撤銷失敗時不能把訂單放回「待寄送」(試算表裡其實還是已寄送,會害人重寄),
              // 改成重新讀取清單,顯示試算表的實際狀態
              function undoFailed(message) {
                alert('撤銷失敗: ' + message + '\n清單會重新讀取，顯示目前的實際狀態');
                loadPending();
              }
              gasCall('unmarkAsSent', Object.assign({ operationTime: res.operationTime }, orderRef(order)))
                .then(function (r) {
                  if (r && r.success) {
                    resetButtons();
                    noteMovedIn('pending', order);
                    restoreMailOrder(order);
                    invalidateReport();
                    showToast('已撤銷「' + order.storeName + '」');
                    // 倒數期間清單可能重新讀取過(卡片已不在畫面上),或有更早送出的查詢還沒回來:
                    // 重新讀一次,以撤銷後的資料庫為準(較早送出的查詢回來會被丟掉)
                    loadPending();
                  } else {
                    undoFailed(r ? r.error : '未知錯誤');
                  }
                })
                .catch(function (err) {
                  undoFailed(err.message);
                });
            },
            function onExpire() {
              removeCard(liveCard(card), 'mailList', applyMailFilters);
            },
            UNDO_MS
          );
        })
        .catch(function (err) {
          if (err && err.retryable) {
            alert('標記失敗: ' + err.message + '\n無法確認是否已標記，清單會重新讀取，顯示目前的實際狀態');
            reloadAfterUnsureWrite();
            return;
          }
          alert('標記失敗: ' + err.message);
          resetButtons();
        });
    }

    function setUnassignLabel(btn, busy) {
      if (busy) {
        btn.textContent = '處理中…';
        return;
      }
      btn.innerHTML = svg('undo', 'ic-sm');
      btn.appendChild(document.createTextNode('門市指派錯了？退回待分配'));
    }

    // 待寄送 → 退回待分配:成功後兩個清單都重新讀取,到「待分配門市」重新選門市
    function unassignPending(order, btn, otherBtns, card) {
      if (!confirm('要把「' + order.storeName + '」這筆退回「待分配門市」嗎？\n\n退回後請到「待分配門市」重新選門市，再回來寄信。')) return;
      btn.disabled = true;
      otherBtns.forEach(function (b) { b.disabled = true; });
      setUnassignLabel(btn, true);
      function reset() {
        btn.disabled = false;
        otherBtns.forEach(function (b) { b.disabled = false; });
        setUnassignLabel(btn, false);
      }
      gasCall('unassignStore', Object.assign({ storeName: order.storeName }, orderRef(order)))
        .then(function (res) {
          if (!res || !res.success) {
            alert('退回失敗: ' + (res ? res.error : '未知錯誤'));
            reset();
            return;
          }
          noteMovedOut('pending', order);
          noteMovedIn('unassigned', order); // 之前在這裡指派過、現在退回:要能再出現
          removeMailOrder(order);
          invalidateReport();
          removeCard(liveCard(card), 'mailList', applyMailFilters);
          showToast('已退回「待分配門市」，請到那裡重新選門市');
          loadUnassigned(undefined, 'addNew');
        })
        .catch(function (err) {
          if (err && err.retryable) {
            alert('退回失敗: ' + err.message + '\n無法確認是否已退回，清單會重新讀取，顯示目前的實際狀態');
            reloadAfterUnsureWrite();
            return;
          }
          alert('退回失敗: ' + err.message);
          reset();
        });
    }

    // ----- 待分配門市 -----
    // 最近門市要查地址座標,比較慢:沒打開「待分配門市」分頁時只抓清單(算筆數),切過去才查最近門市
    // forceNearest:清單已經先顯示,接著在背景補查附近門市與距離(不用等使用者切到這個分頁)
    // mode 'addNew':剛有訂單退回待分配:清單已經在畫面上就不重建(已選的門市、送出中的狀態保留),只把新的加進來
    // mode 'rebuild':寫入結果不確定,整份清單照後端重建
    function loadUnassigned(forceNearest, mode) {
      const withNearest = forceNearest === true || mailTab === 'unassigned';
      const addNew = mode === 'addNew';
      const keepList = mode !== 'rebuild' && unassignedOrders.length > 0 && (addNew || (withNearest && !unassignedHasNearest));
      const nearInPlace = keepList && withNearest; // 保留清單,同時就地補上附近門市
      const startSeq = writeSeq;
      if (nearInPlace) {
        showNearLoading(true);
      } else if (!keepList) {
        showSkeleton('unassignedList');
      }
      unassignedBusy = true;
      clearTimeout(unassignedLoadingTimeout);
      // 背景查附近門市時清單已經能操作,文字要講清楚;查完(成功或失敗)要把這句換回「更新於」
      const waitMsgs = ['附近門市還在查詢中（已超過 10 秒），清單可以先操作', '待分配門市已等待超過 10 秒，仍在等待回應…'];
      unassignedLoadingTimeout = setTimeout(function () {
        if (mailTab === 'unassigned') setMailStatus(waitMsgs[nearInPlace ? 0 : 1]);
      }, 10000);
      function endWait() {
        clearTimeout(unassignedLoadingTimeout);
        if (view === 'mail' && waitMsgs.indexOf($('status').textContent) !== -1) showUpdated('mail');
      }

      const fresh = latestOnly('unassigned');
      // 背景補查失敗:清單和已選的門市都留著,只在上方說明;切回這個分頁或按重新整理會再試
      function nearFailed(message) {
        unassignedBusy = false;
        endWait();
        if (!nearInPlace) {
          // 只是要加入剛退回的訂單:清單照舊,提示重新整理
          showToast('待分配清單沒有更新成功（' + message + '），請按重新整理');
          return;
        }
        showNearLoading(false);
        const list = $('unassignedList');
        const oldWarn = list.querySelector('.near-error');
        if (oldWarn) oldWarn.remove();
        list.insertBefore(nearErrorEl(message), list.firstChild);
      }
      gasCall('getUnassignedOrders', { withNearest: withNearest }).then(fresh(function (result) {
        unassignedBusy = false;
        // 清單讀到了不代表最近門市查好了:後端可能附上 nearestError,這時切回分頁要再查
        unassignedHasNearest = withNearest && !!(result && result.success) && !result.nearestError;
        endWait();
        if (!result || !result.success) {
          if (keepList) nearFailed(result ? result.error : '後端回傳空值');
          else onUnassignedError({ message: result ? result.error : '後端回傳空值' });
          return;
        }
        if (keepList) {
          // 清單已經在畫面上(可能已經選了門市):不重建,補上最近門市 / 加入新的訂單
          if (nearInPlace) {
            showNearLoading(false);
            applyNearestInPlace(result);
          }
          if (addNew) appendNewUnassigned(result.orders || [], startSeq);
        } else {
          unassignedOrders = sortBySubmit((result.orders || []).filter(notMovedSince('unassigned', startSeq)));
          storeNameOptions = result.storeNames || [];
          fillStoreDatalist();
          setUnassignedTabCount(unassignedOrders.length);
          renderUnassignedList(unassignedOrders, result.nearestError);
        }
        // 清單先出來了,接著在背景查附近門市與距離
        if (!withNearest && unassignedOrders.length) loadUnassigned(true);
      })).catch(fresh(function (err) {
        endWait();
        if (keepList) nearFailed(err && err.message ? err.message : String(err));
        else onUnassignedError(err);
      }));
    }

    // 待分配清單最上方的「正在找附近門市與距離…」提示
    function showNearLoading(on) {
      const list = $('unassignedList');
      const old = list.querySelector('.near-loading');
      if (old) old.remove();
      if (!on) return;
      const tip = el('div', 'alert near-loading');
      tip.appendChild(iconEl('clock', 'ic-sm'));
      tip.appendChild(el('span', null, '正在找附近門市與距離…（第一次查詢地址可能要十幾秒，可以先操作）'));
      list.insertBefore(tip, list.firstChild);
    }

    function onUnassignedError(err) {
      unassignedBusy = false;
      clearTimeout(unassignedLoadingTimeout);
      setUnassignedTabCount(null);
      showError('unassignedList', err && err.message ? err.message : JSON.stringify(err), loadUnassigned);
    }

    // 開新分頁(電腦不會蓋掉這個頁面;手機會交給對應 App 或新分頁)
    // 不用 window.open 的 'noopener' 參數:加了之後成功也會回傳 null,會誤判成被擋而多開一個分頁
    function openNewTab(url) {
      const win = window.open(url, '_blank');
      if (win) {
        try { win.opener = null; } catch (e) { }
        return;
      }
      // 被瀏覽器擋下彈出視窗時,改用連結開新分頁
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function openInMaps(query) {
      if (!query || query === NO_VALUE_TEXT) return;
      openNewTab('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query));
    }

    // 複製純文字,回傳 Promise<是否成功>
    function copyPlain(text) {
      function legacy() {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.readOnly = true;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        const ok = legacyCopy_(temp);
        temp.remove();
        return ok;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, legacy);
      }
      return Promise.resolve(legacy());
    }

    // 必勝客官網沒辦法從網址帶入地址:先把地址複製起來,打開官網後直接貼上
    const PH_SITE_URL = 'https://www.pizzahut.com.tw/';
    function openPizzaHutSite(address) {
      copyPlain(address).then(function (ok) {
        showToast(ok ? '已複製外送地址，到官網輸入地址時貼上即可' : '地址複製失敗，請手動複製');
      });
      openNewTab(PH_SITE_URL);
    }

    // 地點資訊:文字可以直接選取;opts.copy 顯示「複製」、opts.map 顯示「附近必勝客」(Google 地圖)、
    // opts.site 顯示「官網」(複製地址並打開必勝客官網)
    function makePlace(labelText, value, opts) {
      opts = opts || {};
      const ok = hasValue(value);
      const wrap = el('div', 'place');
      const head = el('div', 'field-head');
      head.appendChild(el('span', 'field-label', labelText));
      if (ok && (opts.copy || opts.map || opts.site)) {
        const tools = el('span', 'place-tools');
        if (opts.copy) {
          const copyBtn = el('button', 'copy-btn');
          copyBtn.type = 'button';
          setCopyLabel(copyBtn, false);
          copyBtn.addEventListener('click', function () { copyText(value, copyBtn); });
          tools.appendChild(copyBtn);
        }
        if (opts.map) {
          // 在 Google 地圖上搜尋「這個地址附近的必勝客」,地圖會標出周圍每一家
          const nearBtn = el('button', 'copy-btn');
          nearBtn.type = 'button';
          nearBtn.innerHTML = svg('pin', 'ic-sm');
          nearBtn.appendChild(document.createTextNode('附近必勝客'));
          nearBtn.title = '在新分頁打開 Google 地圖，搜尋這個地址附近的必勝客';
          nearBtn.addEventListener('click', function () { openInMaps('必勝客 near ' + value); });
          tools.appendChild(nearBtn);
        }
        if (opts.site) {
          const siteBtn = el('button', 'copy-btn');
          siteBtn.type = 'button';
          siteBtn.innerHTML = svg('store', 'ic-sm');
          siteBtn.appendChild(document.createTextNode('官網'));
          siteBtn.title = '複製外送地址，並在新分頁打開必勝客官網';
          siteBtn.addEventListener('click', function () { openPizzaHutSite(value); });
          tools.appendChild(siteBtn);
        }
        head.appendChild(tools);
      }
      wrap.appendChild(head);
      wrap.appendChild(el('div', 'place-text' + (ok ? '' : ' muted'), ok ? value : NO_VALUE_TEXT));
      return wrap;
    }

    function emptyUnassigned() {
      showState('unassignedList', '🎉', '目前沒有待分配門市的訂單', '有新的待分配訂單時會出現在這裡');
    }

    function renderUnassignedList(orders, nearestError) {
      const list = $('unassignedList');
      list.innerHTML = '';
      updateBulkBar();
      if (!orders.length) {
        emptyUnassigned();
        return;
      }
      if (nearestError) list.appendChild(nearErrorEl(nearestError));
      orders.forEach(function (o) { list.appendChild(buildUnassignedCard(o)); });
      updateBulkBar();
    }

    // ----- 顧客填的「鄰近必勝客門市」模糊比對到門市名單 -----
    // 去掉「必勝客 / Pizza Hut / 門市 / 店」等字和標點後比較:完全相同 > 互相包含 > 兩字片段相似度
    function normStoreText(s) {
      return String(s || '').toLowerCase()
        .replace(/pizza\s*hut|必勝客/g, '')
        .replace(/[\s\-_()（）【】\[\]、,，.。:：]/g, '')
        .replace(/(外送店|外帶店|餐廳店|餐廳|門市|分店|店)$/, '');
    }

    function bigrams(s) {
      const out = [];
      for (let i = 0; i < s.length - 1; i++) out.push(s.substr(i, 2));
      return out;
    }

    function storeSimilarity(a, b) {
      if (!a || !b) return 0;
      if (a === b) return 1;
      const shorter = a.length < b.length ? a : b;
      const longer = a.length < b.length ? b : a;
      // 「信義」對「台北市信義區」這種包含關係;短的那邊越長越可信
      if (shorter.length >= 2 && longer.indexOf(shorter) !== -1) return 0.7 + 0.25 * shorter.length / longer.length;
      const A = bigrams(a);
      const pool = bigrams(b);
      if (!A.length || !pool.length) return 0;
      const total = A.length + pool.length;
      let hit = 0;
      A.forEach(function (x) {
        const k = pool.indexOf(x);
        if (k !== -1) { hit++; pool.splice(k, 1); }
      });
      return 2 * hit / total;
    }

    // 回傳最像的 1~2 家(分數要夠高;第二名要跟第一名差不多才列出)
    function guessStoresFromText(text) {
      const t = normStoreText(text);
      if (t.length < 2) return [];
      const scored = storeNameOptions.map(function (name) {
        return { name: name, score: storeSimilarity(t, normStoreText(name)) };
      }).filter(function (x) { return x.score >= 0.5; })
        .sort(function (a, b) { return b.score - a.score; });
      if (!scored.length) return [];
      return scored.filter(function (x) { return x.score >= scored[0].score - 0.05; }).slice(0, 2)
        .map(function (x) { return x.name; });
    }

    // ----- 建議門市:合併「顧客填的鄰近門市」與「離外送地址最近」,點一下帶入指派 -----
    // 同一家同時符合兩個條件時合成一列,排最前面
    function makeSuggestions(o, select) {
      const customerText = hasValue(o.nearbyStore) ? o.nearbyStore : '';
      const guesses = customerText ? guessStoresFromText(customerText) : [];
      const rows = [];
      const byMatch = {};

      guesses.forEach(function (name) {
        const row = { name: name, match: name, customer: true };
        rows.push(row);
        byMatch[name] = row;
      });
      (o.nearest || []).forEach(function (s) {
        const same = s.match && byMatch[s.match];
        if (same) {
          same.km = s.km;
          same.address = s.address;
          return;
        }
        const row = { name: s.match || s.name, officialName: s.name, match: s.match, km: s.km, address: s.address };
        rows.push(row);
        if (s.match) byMatch[s.match] = row;
      });
      rows.sort(function (a, b) {
        const ra = (a.customer ? 2 : 0) + (a.km !== undefined ? 1 : 0);
        const rb = (b.customer ? 2 : 0) + (b.km !== undefined ? 1 : 0);
        if (ra !== rb) return rb - ra;
        return (a.km === undefined ? Infinity : a.km) - (b.km === undefined ? Infinity : b.km);
      });

      if (!rows.length && !customerText && !o.nearestNote) return null;

      const wrap = el('div', 'place');
      wrap.appendChild(el('div', 'field-label', '建議門市（點一下帶入）'));
      if (customerText) {
        wrap.appendChild(el('div', 'near-note', '顧客填的鄰近門市：「' + customerText + '」' +
          (guesses.length ? '' : '，門市名單裡找不到相近的')));
      }
      if (o.nearestNote) wrap.appendChild(el('div', 'near-note', o.nearestNote));
      if (!rows.length) return wrap;

      const list = el('div', 'near-list');
      const buttons = [];
      rows.forEach(function (r) {
        const btn = el('button', 'near-btn');
        btn.type = 'button';
        btn.dataset.match = r.match || '';
        const main = el('span', 'near-main');
        const nameLine = el('span', 'near-name', r.name);
        if (r.customer) nameLine.appendChild(el('span', 'sug-tag', '顧客填寫'));
        main.appendChild(nameLine);
        let sub = r.address || '';
        if (!r.match) sub = (sub ? sub + '・' : '') + '門市名單裡找不到這家，請手動選';
        if (sub) main.appendChild(el('span', 'near-sub', sub));
        btn.appendChild(main);
        if (r.km !== undefined) btn.appendChild(el('span', 'near-km', r.km + ' km'));
        if (r.match) {
          btn.disabled = select.disabled; // 送出中才補上建議時,一樣先鎖住
          btn.addEventListener('click', function () {
            if (select.disabled) return; // 送出中不能改門市
            select.value = r.match;
            select.dispatchEvent(new Event('change'));
          });
        } else {
          btn.disabled = true;
        }
        buttons.push(btn);
        list.appendChild(btn);
      });
      // 下拉選單選到哪一家,對應的按鈕就亮起來
      select.addEventListener('change', function () {
        buttons.forEach(function (b) { b.classList.toggle('chosen', !!b.dataset.match && b.dataset.match === select.value); });
      });
      wrap.appendChild(list);
      if (rows.some(function (r) { return r.km !== undefined; })) {
        wrap.appendChild(el('div', 'near-note', 'km 是離外送地址的直線距離，不等於實際外送範圍'));
      }
      return wrap;
    }

    function buildUnassignedCard(o) {
      const card = el('article', 'card is-unassigned');
      card.id = 'unassigned-' + orderKey(o);

      const head = el('div', 'card-head');
      head.appendChild(el('h3', 'card-title', orderLabel(o)));
      const badges = el('div', 'badges');
      badges.appendChild(el('span', 'badge late', '待分配'));
      head.appendChild(badges);
      card.appendChild(head);
      card.appendChild(submitLine(o, !hasValue(o.customer)));

      card.appendChild(makePlace('訂購單位', o.orderUnit));
      card.appendChild(makePlace('外送地址', o.deliveryAddress, { copy: true, map: true, site: true }));

      // 指派門市:看得到的是可以打字 / 貼上的輸入框;選定的門市記在隱藏的下拉選單(其他程式都看它)
      const field = el('div', 'place');
      const selectId = 'assign-' + orderKey(o);
      const lab = el('label', 'field-label', '指派門市');
      lab.htmlFor = selectId;
      field.appendChild(lab);
      const input = el('input', 'select store-input');
      input.type = 'text';
      input.id = selectId;
      input.setAttribute('list', STORE_DATALIST_ID);
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('enterkeyhint', 'done');
      input.placeholder = '輸入或貼上門市名稱，例如：新竹馬偕';
      input.style.marginTop = '4px';
      field.appendChild(input);
      const hint = el('div', 'store-hint');
      hint.hidden = true;
      const select = el('select', 'select placeholder');
      select.hidden = true;
      select.tabIndex = -1;
      select.setAttribute('aria-hidden', 'true');
      const placeholder = el('option', null, '請選擇門市…');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      storeNameOptions.forEach(function (name) {
        const opt = el('option', null, name);
        opt.value = name;
        select.appendChild(opt);
      });
      field.appendChild(select);
      field.appendChild(hint);
      bindStoreInput(input, select, hint);
      const suggestions = makeSuggestions(o, select);
      if (suggestions) {
        suggestions.classList.add('sugg-block');
        card.appendChild(suggestions);
      }
      card.appendChild(field);

      const actions = el('div', 'actions');
      const confirmBtn = el('button', 'btn btn-assign btn-block');
      confirmBtn.disabled = true;
      setAssignLabel(confirmBtn, '');
      actions.appendChild(confirmBtn);
      card.appendChild(actions);

      select.addEventListener('change', function () {
        // 不是系統自動預選的變更 = 使用者自己選的(下拉選單或點建議門市),之後不再自動改掉
        if (!autoPicking && card._assign) card._assign.userPicked = true;
        select.classList.toggle('placeholder', !select.value);
        confirmBtn.disabled = !select.value;
        setAssignLabel(confirmBtn, select.value);
        updateBulkBar();
      });
      confirmBtn.addEventListener('click', function () {
        confirmAssign(o, select, confirmBtn, card);
      });
      card._assign = { order: o, select: select, btn: confirmBtn, card: card, userPicked: false };
      preselectNearest(card);
      return card;
    }

    // ----- 指派門市輸入框:打字 / 貼上 -----
    // 共用一份門市清單(datalist):打字時瀏覽器列出符合的門市
    const STORE_DATALIST_ID = 'storeNameList';
    function fillStoreDatalist() {
      let list = document.getElementById(STORE_DATALIST_ID);
      if (!list) {
        list = document.createElement('datalist');
        list.id = STORE_DATALIST_ID;
        document.body.appendChild(list);
      }
      list.innerHTML = '';
      storeNameOptions.forEach(function (name) {
        const opt = document.createElement('option');
        opt.value = name;
        list.appendChild(opt);
      });
    }

    // 輸入的文字 → 門市名單裡的哪一家
    // 只有「完全相同」或「去掉必勝客 / 店等字後完全相同、而且只有一家」才算選定;
    // 只打一部分(例如「新竹」)不自動選,列出候選讓人點,免得一次指派時送出沒看清楚的門市
    function matchStoreInput(text) {
      const t = String(text || '').trim();
      if (!t) return { name: '', candidates: [] };
      if (storeNameOptions.indexOf(t) !== -1) return { name: t, candidates: [] };
      const n = normStoreText(t);
      if (!n) return { name: '', candidates: [] };
      const same = storeNameOptions.filter(function (name) { return normStoreText(name) === n; });
      if (same.length === 1) return { name: same[0], candidates: [] };
      const contains = same.length ? same : storeNameOptions.filter(function (name) { return normStoreText(name).indexOf(n) !== -1; });
      return { name: '', candidates: contains };
    }

    function bindStoreInput(input, select, hint) {
      let fromInput = false;
      function showHint(text, res) {
        hint.innerHTML = '';
        hint.hidden = !text || !!res.name;
        if (hint.hidden) return;
        if (!res.candidates.length) {
          hint.appendChild(el('span', 'near-note', '門市名單裡找不到「' + text + '」，請換個寫法或從清單選'));
          return;
        }
        hint.appendChild(el('span', 'near-note', res.candidates.length > 5 ? '符合的有 ' + res.candidates.length + ' 家，再打完整一點，或點一家：' : '是哪一家？點一下帶入：'));
        res.candidates.slice(0, 5).forEach(function (name) {
          const b = el('button', 'cand-btn', name);
          b.type = 'button';
          b.disabled = select.disabled;
          b.addEventListener('click', function () {
            if (select.disabled) return;
            input.value = name;
            apply();
          });
          hint.appendChild(b);
        });
      }
      // 只有使用者打字 / 點候選時呼叫:打過字(即使只打一部分、還沒選定)就不讓背景的最近門市預選蓋掉
      function apply() {
        const card = input.closest('.card');
        if (card && card._assign) card._assign.userPicked = true;
        const text = input.value.trim();
        const res = matchStoreInput(text);
        if (select.value !== res.name) {
          fromInput = true;
          try {
            select.value = res.name;
            select.dispatchEvent(new Event('change'));
          } finally {
            fromInput = false;
          }
        }
        showHint(text, res);
      }
      input.addEventListener('input', apply);
      // 選好後把文字整理成正式店名(例如貼上「必勝客新竹馬偕店」→「新竹馬偕店」)
      input.addEventListener('change', function () { if (select.value) input.value = select.value; });
      // 從建議門市按鈕、最近門市預選改到的:輸入框跟著顯示
      select.addEventListener('change', function () {
        if (fromInput) return;
        input.value = select.value;
        hint.hidden = true;
      });
    }

    // 預設選離外送地址最近、且在門市名單裡的那家(建議清單順序不變,顧客填的仍排第一)
    // 使用者已經自己選過、或正在送出的卡片不動
    let autoPicking = false;
    function preselectNearest(card) {
      const a = card._assign;
      if (!a || a.userPicked || a.select.disabled) return;
      const closest = (a.order.nearest || []).filter(function (s) { return s.match && s.km !== undefined; })
        .sort(function (x, y) { return x.km - y.km; })[0];
      if (!closest) return;
      autoPicking = true;
      try {
        a.select.value = closest.match;
        a.select.dispatchEvent(new Event('change'));
      } finally {
        autoPicking = false;
      }
    }

    function nearErrorEl(message) {
      const warn = el('div', 'alert near-error');
      warn.appendChild(iconEl('alert', 'ic-sm'));
      warn.appendChild(el('span', null, '暫時算不出最近的門市（' + message + '），請用「附近必勝客」按鈕確認。'));
      return warn;
    }

    // 最近門市查好了:就地更新每張卡片的「建議門市」,不重建卡片
    // (使用者在查詢期間選好的門市、正在送出的卡片都保留;剛指派掉或新進的訂單這次不增減,重新整理時才更新)
    function applyNearestInPlace(result) {
      const list = $('unassignedList');
      const oldWarn = list.querySelector('.near-error');
      if (oldWarn) oldWarn.remove();
      if (result.nearestError) list.insertBefore(nearErrorEl(result.nearestError), list.firstChild);
      (result.orders || []).forEach(function (o) {
        const card = document.getElementById('unassigned-' + orderKey(o));
        if (!card || !card._assign) return;
        const a = card._assign;
        a.order.nearest = o.nearest;
        a.order.nearestNote = o.nearestNote;
        const old = card.querySelector('.sugg-block');
        if (old) old.remove();
        const sug = makeSuggestions(a.order, a.select);
        if (sug) {
          sug.classList.add('sugg-block');
          card.insertBefore(sug, a.select.parentNode);
          sug.querySelectorAll('.near-btn').forEach(function (b) {
            b.classList.toggle('chosen', !!b.dataset.match && b.dataset.match === a.select.value);
          });
        }
        preselectNearest(card);
      });
      updateBulkBar();
    }

    // 用訂單比對(清單可能已重新讀取,物件換成新的)
    function dropUnassignedOrder(order) {
      const k = orderKey(order);
      unassignedOrders = unassignedOrders.filter(function (o) { return orderKey(o) !== k; });
    }

    // 清單上還沒有的訂單(例如剛從待寄送退回的)加到最後面,並更新筆數
    // startSeq:這次查詢送出時的寫入序號(查詢送出後才在這個畫面指派掉的,不能被舊資料加回來)
    function appendNewUnassigned(orders, startSeq) {
      const known = {};
      unassignedOrders.forEach(function (o) { known[orderKey(o)] = true; });
      const added = sortBySubmit(orders.filter(function (o) { return !known[orderKey(o)]; }).filter(notMovedSince('unassigned', startSeq)));
      if (!added.length) return;
      const list = $('unassignedList');
      added.forEach(function (o) { list.appendChild(buildUnassignedCard(o)); });
      unassignedOrders = sortBySubmit(unassignedOrders.concat(added));
      setUnassignedTabCount(unassignedOrders.length);
      updateBulkBar();
    }

    // 已選好門市、還沒送出的卡片
    function pendingAssignments() {
      return Array.prototype.slice.call($('unassignedList').querySelectorAll('.card'))
        .filter(function (c) {
          return c._assign && c._assign.select.value && !c._assign.select.disabled && !c.classList.contains('removing');
        })
        .map(function (c) { return c._assign; });
    }

    function updateBulkBar() {
      const items = pendingAssignments();
      const bar = $('bulkAssignBar');
      bar.hidden = mailTab !== 'unassigned' || !items.length;
      if (bar.hidden) return;
      $('bulkAssignText').textContent = '已選好 ' + items.length + ' 筆門市';
      const btn = $('bulkAssignBtn');
      btn.disabled = false;
      btn.innerHTML = svg('store');
      btn.appendChild(document.createTextNode('一次指派 ' + items.length + ' 筆'));
    }

    $('bulkAssignBtn').addEventListener('click', bulkAssign);

    // 一次送出所有選好門市的訂單(只打一次 API);每筆各自成功或失敗
    function bulkAssign() {
      const items = pendingAssignments();
      if (!items.length) return;
      const bar = $('bulkAssignBtn');
      bar.disabled = true;
      bar.textContent = '指派中…';
      items.forEach(function (it) {
        lockAssignSelect(it.select, true);
        it.btn.disabled = true;
        it.btn.textContent = '處理中…';
      });

      function resetItem(it) {
        lockAssignSelect(it.select, false);
        it.btn.disabled = !it.select.value;
        setAssignLabel(it.btn, it.select.value);
      }

      gasCall('assignStores', {
        items: items.map(function (it) { return { orderId: it.order.orderId, submitTimeKey: it.order.submitTimeKey, storeName: it.select.value }; })
      }).then(function (res) {
        if (!res || !res.success) {
          alert('指派失敗: ' + (res ? res.error : '未知錯誤'));
          items.forEach(resetItem);
          updateBulkBar();
          return;
        }
        let ok = 0;
        const failed = [];
        res.results.forEach(function (r, i) {
          const it = items[i];
          if (r && r.success) {
            ok++;
            noteMovedOut('unassigned', it.order);
            noteMovedIn('pending', it.order);
            dropUnassignedOrder(it.order);
            removeCard(liveCard(it.card), 'unassignedList', emptyUnassigned);
          } else {
            failed.push(orderLabel(it.order) + '：' + (r ? r.error : '未知錯誤'));
            resetItem(it);
          }
        });
        setUnassignedTabCount(unassignedOrders.length);
        updateBulkBar();
        if (ok) {
          invalidateReport();
          showToast('已指派 ' + ok + ' 筆，待寄送訂單同步更新中');
          loadPending();
        }
        if (failed.length) alert('有 ' + failed.length + ' 筆沒有指派成功：\n' + failed.join('\n'));
      }).catch(function (err) {
        if (err && err.retryable) {
          alert('指派失敗: ' + err.message + '\n無法確認是否已指派，清單會重新讀取，顯示目前的實際狀態');
          reloadAfterUnsureWrite();
          return;
        }
        alert('指派失敗: ' + err.message);
        items.forEach(resetItem);
        updateBulkBar();
      });
    }

    // 送出中:下拉選單和建議門市按鈕一起鎖住(找不到門市的建議本來就停用,不動)
    function lockAssignSelect(select, locked) {
      select.disabled = locked;
      const card = select.closest('.card');
      if (!card) return;
      card.querySelectorAll('.near-btn').forEach(function (b) {
        if (b.dataset.match) b.disabled = locked;
      });
      card.querySelectorAll('.store-input, .cand-btn').forEach(function (b) { b.disabled = locked; });
    }

    function setAssignLabel(btn, storeName) {
      btn.innerHTML = svg('store');
      btn.appendChild(document.createTextNode(storeName ? '指派給「' + storeName + '」' : '請先選擇門市'));
    }

    function confirmAssign(order, select, btn, card) {
      const storeName = select.value;
      if (!storeName) {
        alert('請先選擇門市，再按確認指派');
        return;
      }
      btn.disabled = true;
      btn.textContent = '處理中…';
      lockAssignSelect(select, true);
      updateBulkBar();

      function reset() {
        btn.disabled = false;
        lockAssignSelect(select, false);
        setAssignLabel(btn, select.value);
        updateBulkBar();
      }

      gasCall('assignStore', { orderId: order.orderId, submitTimeKey: order.submitTimeKey, storeName: storeName })
        .then(function (res) {
          if (!res || !res.success) {
            alert('指派失敗: ' + (res ? res.error : '未知錯誤'));
            reset();
            return;
          }
          noteMovedOut('unassigned', order);
          noteMovedIn('pending', order);
          dropUnassignedOrder(order);
          setUnassignedTabCount(unassignedOrders.length);
          invalidateReport();
          showToast('已指派「' + res.storeName + '」，待寄送訂單同步更新中');
          removeCard(liveCard(card), 'unassignedList', emptyUnassigned);
          updateBulkBar();
          // 指派完成後自動重整「待寄送」,不用手動按重整才會看到剛指派好的這筆
          loadPending();
        })
        .catch(function (err) {
          if (err && err.retryable) {
            alert('指派失敗: ' + err.message + '\n無法確認是否已指派，清單會重新讀取，顯示目前的實際狀態');
            reloadAfterUnsureWrite();
            return;
          }
          alert('指派失敗: ' + err.message);
          reset();
        });
    }

    // 寫入逾時或斷線、自動重試也失敗:不知道後端到底寫了沒,重新讀取寄信助手兩個清單
    function reloadAfterUnsureWrite() {
      invalidateReport();
      loadPending();
      loadUnassigned(undefined, 'rebuild');
    }

    let savedPw = '';
    try {
      savedPw = localStorage.getItem(PW_STORAGE_KEY) || '';
      const legacyPw = localStorage.getItem(LEGACY_PW_STORAGE_KEY);
      if (legacyPw) {
        if (!savedPw) savedPw = legacyPw;
        localStorage.removeItem(LEGACY_PW_STORAGE_KEY);
      }
    } catch (e) { /* 讀不到就當作沒有 */ }
    if (savedPw) login(savedPw, true);
  </script>
</body>

</html>
