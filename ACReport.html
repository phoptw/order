<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <title>Big Order 管理系統</title>
  <!-- 加到手機主畫面時的圖示與名稱(iPhone 讀 apple-touch-icon,Android 讀 manifest)
       manifest 的 display 是 standalone:從主畫面打開是獨立 App(iPhone 要這樣才能收網頁推播);
       iPhone 的 App 跟 Safari 分開記密碼,第一次從主畫面打開要登入一次 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Big Order">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 設計變數(淺色 / 深色自動切換) ===== */
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e2e5ea;
      --grid: #e1e0d9;
      --text: #1a1c20;
      --text-2: #565c66;
      --text-3: #8a909a;
      --accent: #c8102e;
      --accent-hover: #a30d25;
      --accent-soft: #fdecef;
      --blue: #1d5bd8;
      --blue-soft: #e8effd;
      --amber: #a85d00;
      --amber-soft: #fdf2e0;
      --green: #157a3a;
      --green-soft: #e4f4ea;
      --red: #c21f1f;
      --red-soft: #fdeaea;
      --gray-soft: #eceef1;
      /* 四個節點狀態的顏色:已用色盲模擬檢查過(相鄰色差足夠),深色模式另有一組 */
      --st-pending: #2a78d6;
      --st-pending-soft: #e7f0fb;
      --st-talking: #eb6834;
      --st-talking-soft: #fdeee6;
      --st-won: #1baf7a;
      --st-won-soft: #e2f6ee;
      --st-lost: #6250d6;
      --st-lost-soft: #ecebfb;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
      --shadow-lg: 0 10px 30px rgba(16, 24, 40, .18);
      --radius: 16px;
      --radius-sm: 11px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101215;
        --surface: #1a1d21;
        --surface-2: #22262b;
        --border: #30353c;
        --grid: #2c2f34;
        --text: #eceef1;
        --text-2: #aab0b9;
        --text-3: #7c838d;
        --accent: #e5384f;
        --accent-hover: #f0566b;
        --accent-soft: #3b1a20;
        --blue: #86aeff;
        --blue-soft: #1d2840;
        --amber: #f3b95f;
        --amber-soft: #382a14;
        --green: #6bd495;
        --green-soft: #183224;
        --red: #ff8585;
        --red-soft: #3c1c1c;
        --gray-soft: #2a2e34;
        --st-pending: #3987e5;
        --st-pending-soft: #1b2a40;
        --st-talking: #d95926;
        --st-talking-soft: #3a2319;
        --st-won: #199e70;
        --st-won-soft: #14302a;
        --st-lost: #9085e9;
        --st-lost-soft: #26233f;
        --shadow: 0 0 0 1px rgba(255, 255, 255, .02);
        --shadow-lg: 0 10px 30px rgba(0, 0, 0, .55);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .ic {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: block;
    }

    .ic-sm {
      width: 16px;
      height: 16px;
    }

    /* 狀態色:每個元素用 --c(主色)、--soft(淡底色) */
    .s-pending {
      --c: var(--st-pending);
      --soft: var(--st-pending-soft);
    }

    .s-talking {
      --c: var(--st-talking);
      --soft: var(--st-talking-soft);
    }

    .s-won {
      --c: var(--st-won);
      --soft: var(--st-won-soft);
    }

    .s-lost {
      --c: var(--st-lost);
      --soft: var(--st-lost-soft);
    }

    /* ===== 登入 ===== */
    body.logged-out .needs-login {
      display: none !important;
    }

    body:not(.logged-out) #loginPanel {
      display: none;
    }

    .login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 32px 24px 24px;
    }

    .login-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .login-badge .ic {
      width: 28px;
      height: 28px;
    }

    .login-card h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--text-2);
      font-size: 15px;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      width: 100%;
      height: 52px;
      padding: 0 52px 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 17px;
      letter-spacing: .04em;
    }

    .pw-wrap input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .pw-toggle {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      background: none;
      color: var(--text-3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-error {
      color: var(--red);
      font-size: 14px;
      min-height: 22px;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    /* ===== 按鈕 ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 16px;
      transition: background .15s, border-color .15s, color .15s, transform .08s, opacity .15s;
      text-decoration: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .btn:disabled {
      cursor: default;
      opacity: .5;
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary.is-saved {
      background: var(--green);
      opacity: 1;
    }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-small {
      min-height: 38px;
      font-size: 14px;
      padding: 0 14px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--surface-2);
    }

    .icon-btn.spinning .ic {
      animation: spin .7s linear;
    }

    .icon-btn.syncing .ic {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== 頂部列 ===== */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .appbar-inner,
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }

    .narrow {
      max-width: 680px;
      margin: 0 auto;
    }

    .appbar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 8px 6px 16px;
    }

    .appbar-text {
      flex: 1;
      min-width: 0;
    }

    .appbar-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .appbar-status {
      font-size: 13px;
      color: var(--text-3);
      min-height: 18px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .identity-text {
      flex: 1;
      min-width: 0;
    }

    .identity-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity-sub {
      font-size: 13px;
      color: var(--text-3);
    }

    /* 手機通知 */
    #pushBtn.on {
      color: var(--accent);
    }

    .push-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      margin: 0 16px 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg, var(--surface));
    }

    .push-panel[hidden] {
      display: none;
    }

    .push-text {
      flex: 1 1 220px;
      min-width: 0;
    }

    .push-title {
      font-weight: 700;
      font-size: 14px;
    }

    .push-sub {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 2px;
    }

    .push-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-switch-wrap {
      padding: 0 16px 12px;
    }

    .select {
      width: 100%;
      height: 46px;
      padding: 0 40px 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a909a' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center / 18px;
      appearance: none;
      -webkit-appearance: none;
      font-size: 16px;
      min-width: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--gray-soft);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .seg-btn {
      border: 0;
      background: transparent;
      border-radius: 9px;
      min-height: 40px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .count {
      font-size: 12px;
      font-weight: 700;
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 20px;
      background: var(--surface-2);
      color: var(--text-2);
    }

    .seg-btn.active .count {
      background: var(--accent);
      color: #fff;
    }

    /* ===== 明細:統計 / 分頁 / 搜尋 ===== */
    .detail-picker {
      padding: 16px 16px 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 16px 16px 4px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 10px 9px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      flex-shrink: 0;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      margin-top: 2px;
    }

    .stat-extra {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      padding: 12px 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search {
      position: relative;
      display: block;
    }

    .search .ic {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
    }

    .search input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 16px;
    }

    .search input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    /* ===== 卡片 ===== */
    .list {
      padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      --stripe: var(--st-pending);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--c, var(--stripe));
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--soft);
      color: var(--text);
      white-space: nowrap;
    }

    .pill .dot {
      width: 7px;
      height: 7px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-2);
      white-space: nowrap;
    }

    .tag.soon {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .tag.late {
      background: var(--red-soft);
      color: var(--red);
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
      word-break: break-word;
    }

    .card-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
      font-size: 14px;
      margin-top: 2px;
    }

    .order-no {
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }

    .alert {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: var(--amber-soft);
      color: var(--amber);
    }

    .alert.late {
      background: var(--red-soft);
      color: var(--red);
    }

    .meta {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    .meta-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      min-width: 0;
    }

    .meta-item.full {
      grid-column: 1 / -1;
    }

    .meta-item .ic {
      color: var(--text-3);
      margin-top: 2px;
    }

    .meta-k {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.3;
    }

    .meta-v {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    .meta-v.muted {
      color: var(--text-3);
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0 14px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .readonly-note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 狀態選擇:2x2 按鈕,每顆附一句說明,避免狀態名稱混淆(底層是 radio) */
    .status-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status-opt {
      position: relative;
    }

    .status-opt input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .status-opt .opt-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 60px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: background .15s, border-color .15s;
      user-select: none;
      height: 100%;
    }

    .opt-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 700;
    }

    .opt-hint {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.35;
    }

    .status-opt input:checked+.opt-box {
      background: var(--soft);
      border-color: var(--c);
      box-shadow: inset 0 0 0 1px var(--c);
    }

    .status-opt input:checked+.opt-box .opt-hint {
      color: var(--text-2);
    }

    .status-opt input:focus-visible+.opt-box {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .amount {
      margin-top: 12px;
    }

    .amount-wrap {
      display: flex;
      align-items: center;
      height: 50px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      overflow: hidden;
    }

    .amount-wrap:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .amount-prefix {
      padding: 0 4px 0 14px;
      color: var(--text-3);
      font-weight: 600;
    }

    .amount-wrap input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      background: transparent;
      padding: 0 14px 0 6px;
      font-size: 18px;
      font-weight: 600;
    }

    .amount-wrap input:focus {
      outline: none;
    }

    .save-row {
      margin-top: 12px;
    }

    /* ===== 報表 ===== */
    .report {
      padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
    }

    .filters {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }

    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--surface);
    }

    .filter-selects {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .filter-selects.two {
      grid-template-columns: 1fr 1fr;
    }

    #reportBody {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: opacity .2s;
    }

    #reportBody.is-stale {
      opacity: .5;
      pointer-events: none;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 560px) {
      .kpis {
        grid-template-columns: repeat(3, 1fr);
      }

      .filters {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .filter-selects,
      .filter-selects.two {
        grid-auto-flow: column;
        grid-template-columns: none;
        grid-auto-columns: 200px;
      }
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--text-3);
    }

    .kpi.warn .kpi-value {
      color: var(--red);
    }

    .kpi.warn .kpi-label .ic {
      color: var(--red);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .panel-sub {
      font-size: 13px;
      color: var(--text-3);
    }

    /* 堆疊長條:片段之間 2px 間隙,兩端 4px 圓角 */
    .stackbar {
      display: flex;
      gap: 2px;
      height: 16px;
      border-radius: 4px;
      overflow: hidden;
      background: transparent;
    }

    .stackbar.mini {
      height: 8px;
      width: 110px;
      border-radius: 3px;
    }

    .stackbar .seg {
      background: var(--c);
      min-width: 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--c);
      flex-shrink: 0;
    }

    .legend-num {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .legend-pct {
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* 月份直條圖 */
    .cols-scroll {
      overflow-x: auto;
    }

    .cols {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      min-width: min-content;
      padding-top: 4px;
    }

    .col {
      flex: 1 1 0;
      min-width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .col-total {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }

    .col-stack {
      width: 100%;
      max-width: 48px;
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
    }

    .col-stack .seg {
      background: var(--c);
      min-height: 2px;
    }

    .col-axis {
      width: 100%;
      border-top: 1px solid var(--grid);
      margin-top: 0;
      padding-top: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.3;
    }

    .col-axis small {
      display: block;
      color: var(--text-3);
      font-size: 11px;
    }

    details.numbers {
      margin-top: 12px;
      font-size: 14px;
    }

    details.numbers summary {
      cursor: pointer;
      color: var(--blue);
      font-weight: 600;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    /* 表格:手機上可左右滑,第一欄固定。
       捲動容器本身不能有左右 padding(sticky 會停在 padding 內緣,左邊會露出一條滑過去的資料),
       改成由第一欄 / 最後一欄自己留白 */
    /* 首列凍結:表格自己的捲動框要能上下捲,標題列才黏得住(超過 70% 螢幕高才會出現上下捲動) */
    .tbl-wrap {
      overflow: auto;
      max-height: 70vh;
      margin: 0 -16px;
      padding: 0;
    }

    .tbl {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
      white-space: nowrap;
    }

    .tbl th,
    .tbl td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--grid);
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: var(--surface);
    }

    .tbl th:last-child,
    .tbl td:last-child {
      padding-right: 16px;
    }

    .tbl th:first-child,
    .tbl td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 2;
      padding-left: 16px;
      max-width: 176px;
      overflow: hidden;
      text-overflow: ellipsis;
      /* 右側細線 + 淡陰影,讓人看出這欄是固定的 */
      box-shadow: inset -1px 0 0 var(--grid), 6px 0 8px -6px rgba(0, 0, 0, .18);
    }

    .tbl th {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 600;
      padding-top: 4px;
    }

    /* 首列凍結;左上角那格同時凍結列與欄,要蓋在兩者上面 */
    .tbl thead th {
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .tbl thead th:first-child {
      z-index: 4;
    }

    .tbl th button {
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .tbl th[aria-sort] button {
      color: var(--text);
    }

    .tbl td.left {
      text-align: left;
    }

    .tbl tbody tr.clickable {
      cursor: pointer;
    }

    .tbl tbody tr.clickable:hover td {
      background: var(--surface-2);
    }

    .tbl .name-cell {
      font-weight: 600;
    }

    .tbl .muted {
      color: var(--text-3);
    }

    .tbl-more {
      margin-top: 12px;
    }

    .attn-list {
      display: flex;
      flex-direction: column;
    }

    .attn-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--grid);
      background: none;
      padding: 10px 0;
    }

    .attn-item:last-child {
      border-bottom: 0;
    }

    .attn-main {
      flex: 1;
      min-width: 0;
    }

    .attn-title {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attn-sub {
      font-size: 13px;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attn-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .footnote {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
    }

    #tooltip {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      background: #24272c;
      color: #fff;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      transform: translate(-50%, calc(-100% - 10px));
      white-space: nowrap;
    }

    /* ===== 狀態畫面 ===== */
    .state {
      text-align: center;
      color: var(--text-2);
      padding: 56px 24px;
    }

    .state-icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .state-title {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .state-text {
      font-size: 14px;
    }

    .error-box {
      background: var(--red-soft);
      color: var(--red);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .error-box strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .error-box .btn {
      margin-top: 12px;
    }

    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .sk-line {
      height: 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--gray-soft) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    /* ===== Toast ===== */
    #toast-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 520px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: #24272c;
      color: #fff;
      box-shadow: var(--shadow-lg);
      font-size: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: none;
    }

    .toast .ic {
      color: #6bd495;
    }

    .toast .msg {
      flex: 1;
      min-width: 0;
    }

    .undo-btn {
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #9ec1ff;
      font-weight: 700;
      border-radius: 8px;
      min-height: 36px;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .toast-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: #9ec1ff;
      width: 100%;
      transform-origin: left;
      animation: countdown linear forwards;
    }

    @keyframes countdown {
      to {
        transform: scaleX(0);
      }
    }

    /* ===== 寄信助手(管理員):待寄送 / 待分配門市 ===== */
    .segmented.three {
      grid-template-columns: repeat(3, 1fr);
    }

    @media (max-width: 400px) {
      .segmented.three .seg-btn .ic {
        display: none;
      }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip .n {
      font-size: 12px;
      opacity: .8;
    }

    .mail-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #mailView .card {
      --stripe: var(--blue);
      transition: opacity .3s, transform .3s, max-height .35s, margin .35s, padding .35s;
      max-height: 2000px;
    }

    #mailView .card.is-overdue,
    #mailView .card.is-unassigned {
      --stripe: var(--amber);
    }

    #mailView .card.is-missing {
      --stripe: var(--red);
    }

    #mailView .card.is-done {
      opacity: .55;
    }

    #mailView .card.removing {
      opacity: 0;
      transform: scale(.97);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: -12px;
      border-width: 0;
    }

    #mailView .card-head {
      align-items: flex-start;
      margin-bottom: 0;
    }

    #mailView .card-title {
      font-size: 18px;
    }

    #mailView .card-sub {
      color: var(--text-3);
      font-size: 13px;
      margin-top: 4px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge.ok {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge.warn {
      background: var(--red-soft);
      color: var(--red);
    }

    .badge.late {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    /* 退回待分配:次要中的次要,不要跟「已寄送」搶眼 */
    #mailView .unassign-btn {
      color: var(--text-2);
      font-weight: 500;
    }

    #mailView .unassign-btn:hover:not(:disabled) {
      border-color: var(--text-2);
      color: var(--text);
    }

    #mailView .btn-secondary:not(.unassign-btn):hover:not(:disabled) {
      border-color: var(--green);
      color: var(--green);
    }

    #mailView .btn-secondary.is-done {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
      opacity: 1;
    }

    .btn-assign {
      background: var(--green);
      color: #fff;
    }

    /* 信件詳細內容:預設收合 */
    details.mail {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }

    details.mail summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }

    details.mail summary::-webkit-details-marker {
      display: none;
    }

    details.mail summary .ic {
      transition: transform .2s;
    }

    details.mail[open] summary .ic {
      transform: rotate(180deg);
    }

    .field {
      margin-top: 10px;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-2);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      min-height: 32px;
    }

    .copy-btn.copied {
      background: var(--green-soft);
      color: var(--green);
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      resize: vertical;
    }

    .field textarea {
      min-height: 180px;
      line-height: 1.6;
    }

    .place {
      margin-top: 12px;
    }

    .place-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .place-btn .ic {
      color: var(--accent);
    }

    .place-btn .go {
      margin-left: auto;
      font-size: 13px;
      color: var(--blue);
      flex-shrink: 0;
    }

    .place-btn:disabled {
      color: var(--text-3);
      font-weight: 400;
      cursor: default;
    }

    .place-btn:disabled .ic {
      color: var(--text-3);
    }

    .select.placeholder {
      color: var(--text-3);
    }

    /* 指派門市:可打字的輸入框(沒有下拉箭頭) */
    .store-input {
      background-image: none;
      padding-right: 14px;
    }

    .store-input::placeholder {
      color: var(--text-3);
    }

    .store-hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .store-hint[hidden] {
      display: none;
    }

    .cand-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 14px;
    }

    .cand-btn:hover:not(:disabled) {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .cand-btn:disabled {
      opacity: .5;
      cursor: default;
    }

    /* 一次指派:固定在畫面底部 */
    .bulk-bar {
      position: sticky;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 20;
      margin: -84px 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 10px 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--green);
      box-shadow: var(--shadow-lg);
    }

    .bulk-text {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--text-2);
    }

    .bulk-bar .btn {
      flex-shrink: 0;
    }

    /* 地點文字(可選取複製) */
    .place-tools {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .place-text {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .place-text.muted {
      color: var(--text-3);
      font-weight: 400;
    }

    /* 最近門市 */
    .near-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .near-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color .15s, background .15s;
    }

    .near-btn:hover:not(:disabled) {
      border-color: var(--green);
    }

    .near-btn.chosen {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .near-btn:disabled {
      cursor: default;
      opacity: .65;
    }

    .near-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .near-name {
      font-size: 15px;
      font-weight: 600;
    }

    .near-sub {
      font-size: 12px;
      color: var(--text-3);
    }

    .near-km {
      flex-shrink: 0;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-2);
    }

    .near-note {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-3);
    }

    .near-list+.near-note {
      font-size: 12px;
    }

    .sug-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: var(--blue-soft);
      color: var(--blue);
      vertical-align: 2px;
    }

    #mailView .list>.near-error,
    #mailView .list>.near-loading {
      margin-top: 0;
    }

    #mailView .list>.near-loading {
      background: var(--blue-soft, #eaf1fd);
      color: var(--blue);
    }

    @media (min-width: 760px) {
      #mailView .list>.near-error,
      #mailView .list>.near-loading {
        grid-column: 1 / -1;
      }
    }

    /* ===== 營運狀況(管理員) ===== */
    .ops-warn {
      margin-top: 12px;
      background: var(--red-soft);
      color: var(--red);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 可點的 KPI 卡片(營運狀況 → 寄信助手) */
    .kpi-link {
      position: relative;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      padding-right: 36px;

  <script>
    // ⚠ 請把這裡換成你部署的 Apps Script API 網址(結尾是 /exec)
    // 後端:Supabase 資料庫上的 Edge Function(supabase/functions/api);舊的 Apps Script API 已停用
    const API_BASE_URL = 'https://fzyuiwpiqcfkotkauywd.supabase.co/functions/v1/api';

    // 統一呼叫後端 API 的小工具:一律 POST + text/plain(避免 CORS preflight),並帶上登入密碼。
    // 密碼錯誤/失效時直接跳回登入畫面,並回傳一個永遠不會完成的 Promise,讓呼叫端不會再蓋掉畫面
    // 遇到 Google 臨時錯誤頁或連線中斷時自動重試一次(逾時不重試)。寫入的動作重做也不會出錯:
    // 標記帶同一個 markToken、撤銷核對標記時間、指派與更新狀態遇到「已經是要存的值」直接算成功
    // (操作紀錄 logAcAction 重送會多一列,不重試;退回待分配 unassignStore 也不重試:
    //  第一次其實成功、期間別人又指派回同一家時,重送會把新的指派退掉,改成提示並重新讀取)
    const RETRYABLE_ACTIONS = ['login', 'getReport', 'getOrdersForAc', 'getPendingOrders', 'getUnassignedOrders',
      'markAsSent', 'unmarkAsSent', 'assignStore', 'assignStores', 'updateNodeStatus'];
    const WRITE_ACTIONS = ['markAsSent', 'unmarkAsSent', 'assignStore', 'assignStores', 'unassignStore', 'updateNodeStatus'];
    // 等多久沒回應就中斷(手機網路卡住時按鈕不會一直停在處理中)
    // 不能設太短:試算表大時 Google 本來就要 20~40 秒,太早中斷再重送只會讓伺服器多做一次、更慢
    const READ_TIMEOUT_MS = 90000;
    const WRITE_TIMEOUT_MS = 90000;

    // 每次登入 / 登出都換一個編號;回應回來時編號已經不同(期間有人登出或換人登入),就整個丟掉,
    // 避免上一位使用者的資料(例如管理員的全部訂單)出現在下一位的畫面上
    let sessionSeq = 0;
    const NEVER = function () { return new Promise(function () { }); };
    // 進行中的請求;登出時全部中斷
    const inflight = [];
    function abortInflight() {
      inflight.splice(0).forEach(function (c) { try { c.abort(); } catch (e) { } });
    }

    // ===== 速度診斷:網址加 ?diag 時,畫面下方列出每一段花了多久(平常不顯示) =====
    const DIAG = /[?&]diag\b/.test(location.search);
    function diag(msg) {
      if (!DIAG) return;
      let box = document.getElementById('diagBox');
      if (!box) {
        box = document.createElement('div');
        box.id = 'diagBox';
        box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;max-height:40vh;overflow:auto;' +
          'background:rgba(0,0,0,.85);color:#fff;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap';
        document.body.appendChild(box);
      }
      const line = document.createElement('div');
      line.textContent = (performance.now() / 1000).toFixed(1) + 's  ' + msg;
      box.appendChild(line);
    }
    if (DIAG) {
      window.addEventListener('load', function () {
        setTimeout(function () {
          const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          if (nav) diag('頁面下載 ' + Math.round(nav.responseEnd - nav.startTime) + 'ms（' + (nav.transferSize ? Math.round(nav.transferSize / 1024) + 'KB' : '快取') + '），頁面就緒 ' + Math.round(nav.domContentLoadedEventEnd) + 'ms');
        }, 0);
      });
    }

    function gasCall(action, params, isRetry) {
      const t0 = performance.now();
      let tHead = 0;
      let bytes = 0;
      const session = sessionSeq;
      const body = Object.assign({ action: action, pw: password }, params || {});
      const isWrite = WRITE_ACTIONS.indexOf(action) !== -1;
      const limit = isWrite ? WRITE_TIMEOUT_MS : READ_TIMEOUT_MS;
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      if (ctrl) inflight.push(ctrl);
      function done() {
        const i = inflight.indexOf(ctrl);
        if (i !== -1) inflight.splice(i, 1);
      }
      let timer = null;
      // 時間到就中斷;不支援 AbortController 的瀏覽器也照樣以逾時錯誤結束(請求本身繼續跑完)
      const timeout = new Promise(function (_, reject) {
        timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
          const e = new Error('連線逾時（等了 ' + Math.round(limit / 1000) + ' 秒沒有回應）');
          e.retryable = true;
          e.timeout = true;
          reject(e);
        }, limit);
      });
      const request = fetch(API_BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (r) {
        tHead = performance.now();
        return r.text().then(function (t) { bytes = t.length; return parseApiText_(t); });
      }, explainFetchError_);
      return Promise.race([request, timeout]).then(function (res) {
        clearTimeout(timer);
        done();
        if (DIAG) {
          const tGot = performance.now();
          // 呼叫端拿到資料後同步畫畫面;下一個 setTimeout 時畫完了
          setTimeout(function () {
            diag(action + (isRetry ? '(重試)' : '') + '（' + (t0 / 1000).toFixed(1) + 's 送出）：等回應 ' + Math.round(tHead - t0) + 'ms，下載 ' + Math.round(tGot - tHead) +
              'ms（' + Math.round(bytes / 1024) + 'KB），畫面 ' + Math.round(performance.now() - tGot) + 'ms');
          }, 0);
        }
        return res;
      }, function (err) {
        clearTimeout(timer);
        done();
        diag(action + (isRetry ? '(重試)' : '') + '：失敗 ' + Math.round(performance.now() - t0) + 'ms ' + (err && err.message ? err.message.split('\n')[0] : ''));
        throw err;
      }).then(function (res) {
        if (session !== sessionSeq) return NEVER();
        if (res && res.authError) {
          showLogin(res.error && res.error !== '密碼錯誤' ? res.error : '密碼錯誤或已失效，請重新輸入');
          return NEVER();
        }
        return res;
      }, function (err) {
        if (session !== sessionSeq) return NEVER();
        // 逾時不再重送:伺服器可能還在算,重送只會讓它多做一次、使用者多等一輪
        if (err.retryable && !err.timeout && !isRetry && RETRYABLE_ACTIONS.indexOf(action) !== -1) {
          return new Promise(function (resolve) { setTimeout(resolve, 2000); })
            .then(function () { return session === sessionSeq ? gasCall(action, params, true) : NEVER(); });
        }
        throw err;
      });
    }

    // 後端回的不是 JSON(Google 臨時錯誤、執行逾時、授權頁等)時,把 Google 頁面上的文字整理出來顯示
    function parseApiText_(text) {
      try { return JSON.parse(text); } catch (e) {
        const err = new Error('伺服器暫時沒有回傳資料，請稍候按右上角重新整理。如果一直出現，請截圖給管理員。\nGoogle 訊息：' + describeHtml_(text));
        err.retryable = true;
        throw err;
      }
    }

    // 從 Google 錯誤頁取出標題與內文(去掉程式碼),最多 200 字
    function describeHtml_(html) {
      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script, style').forEach(function (n) { n.remove(); });
        const title = (doc.title || '').trim();
        const text = (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').trim();
        return ((title ? title + '｜' : '') + text).slice(0, 200) || '(空白頁)';
      } catch (e) {
        return html.slice(0, 120);
      }
    }

    // 跨網域時瀏覽器只會給 "Failed to fetch",補上最常見的原因
    function explainFetchError_(err) {
      const e = new Error(err.message + '\n可能原因:① 網路中斷;② API_BASE_URL 不是 apps-script-api 的 /exec 網址;③ 頁面放在禁止對外連線的環境(例如 Claude Artifact)。');
      e.retryable = true;
      throw e;
    }

    // ===== 圖示(靜態 SVG,只用在固定字串,不放使用者資料) =====
    const ICONS = {
      lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
      eyeOff: '<path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>',
      sync: '<path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="M8 17l4 4 4-4"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
      store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
      calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
      cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
      phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
      alert: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
      check: '<path d="M20 6L9 17l-5-5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/>',
      chart: '<path d="M3 3v18h18"/><path d="M8 17V11M13 17V7M18 17v-4"/>',
      list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
      eyeView: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
      sort: '<path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/>',
      chevronRight: '<path d="M9 6l6 6-6 6"/>',
      mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
      chevron: '<path d="M6 9l6 6 6-6"/>',
      copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
      pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
      undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'
    };

    function svg(name, extraClass) {
      return '<svg class="ic' + (extraClass ? ' ' + extraClass : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
    }

    function iconEl(name, extraClass) {
      const span = document.createElement('span');
      span.innerHTML = svg(name, extraClass);
      return span.firstChild;
    }

    // 把 HTML 裡 data-icon 的元素填入對應圖示
    document.querySelectorAll('[data-icon]').forEach(function (node) {
      node.innerHTML = svg(node.dataset.icon, node.closest('.seg-btn') ? 'ic-sm' : '');
    });

    // 建立元素的小工具:文字一律用 textContent,不會被當成 HTML 解析
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    const $ = function (id) { return document.getElementById(id); };

    // ===== 常數 =====
    const NO_VALUE_TEXT = '顧客未提供';
    // 試算表裡存的狀態值(不變,舊資料不用改)
    const STATUS_PENDING = '待聯繫';
    const STATUS_NOT_ORDERED = '未下單';
    const STATUS_WON = '已成單';
    const STATUS_LOST = '未成單';
    const STATUSES = [STATUS_PENDING, STATUS_NOT_ORDERED, STATUS_WON, STATUS_LOST];
    const CLOSED_STATUSES = [STATUS_WON, STATUS_LOST];
    const OPEN_STATUSES = [STATUS_PENDING, STATUS_NOT_ORDERED];
    // 畫面上顯示的名稱與說明
    const STATUS_LABEL = {};
    STATUS_LABEL[STATUS_PENDING] = '尚未聯繫';
    STATUS_LABEL[STATUS_NOT_ORDERED] = '待下單';
    STATUS_LABEL[STATUS_WON] = '已成交';
    STATUS_LABEL[STATUS_LOST] = '已流失';
    const STATUS_HINT = {};
    STATUS_HINT[STATUS_PENDING] = '還沒打給顧客';
    STATUS_HINT[STATUS_NOT_ORDERED] = '已聯繫，顧客還沒下單';
    STATUS_HINT[STATUS_WON] = '顧客已下單，需填金額';
    STATUS_HINT[STATUS_LOST] = '顧客決定不訂了';
    const STATUS_CLASS = {};
    STATUS_CLASS[STATUS_PENDING] = 'pending';
    STATUS_CLASS[STATUS_NOT_ORDERED] = 'talking';
    STATUS_CLASS[STATUS_WON] = 'won';
    STATUS_CLASS[STATUS_LOST] = 'lost';
    const PW_STORAGE_KEY = 'ac_report_pw';
    // 合併前「訂單寄信助手」頁記住的管理員密碼,第一次打開時搬過來
    const LEGACY_PW_STORAGE_KEY = 'mobile_sidebar_pw';
    const NONE_KEY = '__none__';

    function label(status) {
      return STATUS_LABEL[status] || status;
    }

    function sClass(status) {
      return 's-' + (STATUS_CLASS[status] || 'pending');
    }

    // ===== 狀態 =====
    let role = '';            // 'ac' | 'rc' | 'admin'
    let password = '';
    let view = 'detail';      // 'report' | 'detail' | 'mail'(管理員)
    let currentAc = '';
    let allOrders = [];
    let currentTab = 'open';
    let searchKeyword = '';
    let autoTab = false;      // 從報表點進來時,如果未結案找不到就自動切到已結案
    let loadingTimeout;
    let reportOrders = null;
    let reportOps = null;     // 管理員才有:待寄送 / 待分配 / 今天的每日摘要寄送結果
    let initialReport = null; // 登入時一起帶回、還沒顯示的報表
    const reportFilter = { period: 'all', rc: '', ac: '' };
    const tableSort = {};
    let showAllStores = false;

    function hasValue(v) {
      return v !== undefined && v !== null && String(v).trim() !== '' && v !== NO_VALUE_TEXT;
    }

    function setStatus(msg) {
      $('status').textContent = msg;
    }

    // 三個分頁各自的資料時間,格式統一成「更新於 10/15 14:30」
    const updatedAt = { report: '', detail: '', mail: '' };
    // 按重新整理時,不是目前這頁的分頁標成過期,切過去時自動重抓
    const stale = { report: false, detail: false, mail: false };

    function stamp() {
      const d = new Date();
      const p = function (n) { return String(n).padStart(2, '0'); };
      return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function markUpdated(v) {
      updatedAt[v] = stamp();
      if (view === v) setStatus('更新於 ' + updatedAt[v]);
    }

    function showUpdated(v) {
      setStatus(updatedAt[v] ? '更新於 ' + updatedAt[v] : '');
    }

    function formatMoney(n) {
      return 'NT$ ' + Math.round(Number(n)).toLocaleString('zh-TW');
    }

    function pct(n, d) {
      return d ? Math.round(n / d * 100) + '%' : '—';
    }

    // 依用餐日期由舊到新排序;沒有日期的排最後,同一天再依填寫時間
    function byDiningDate(a, b) {
      const da = typeof a.diningDateKey === 'number' ? a.diningDateKey : Infinity;
      const db = typeof b.diningDateKey === 'number' ? b.diningDateKey : Infinity;
      if (da !== db) return da - db;
      const ta = typeof a.submitTimeKey === 'number' ? a.submitTimeKey : Infinity;
      const tb = typeof b.submitTimeKey === 'number' ? b.submitTimeKey : Infinity;
      return ta - tb;
    }

    // ===== 事件 =====
    $('refreshBtn').addEventListener('click', function () {
      const btn = this;
      btn.classList.add('spinning');
      setTimeout(function () { btn.classList.remove('spinning'); }, 700);
      // 目前這頁立刻重抓;其他分頁標成過期,切過去時才重抓
      // (不一起重抓:同時打好幾支 API 比較慢,也會蓋掉其他頁還沒儲存的選擇)
      stale.report = stale.detail = stale.mail = true;
      if (view === 'report') {
        loadReport();
      } else if (view === 'mail') {
        loadMail();
      } else if (currentAc) {
        logAction('重新整理', '');
        loadOrders(currentAc);
      }
    });

    // 管理員:立刻把試算表(CakeSurvey)的新訂單搬進資料庫,不用等每 5 分鐘的自動同步
    // 要經過試算表的 Apps Script,大約 10~40 秒;搬完重新讀取目前這一頁
    $('syncBtn').addEventListener('click', function () {
      const btn = this;
      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.add('syncing');
      setStatus('正在從試算表同步新訂單…（約 10～40 秒）');
      function done() {
        btn.disabled = false;
        btn.classList.remove('syncing');
      }
      gasCall('syncNow').then(function (res) {
        done();
        if (!res || !res.success) {
          showUpdated(view);
          alert('同步失敗：' + (res ? res.error : '後端回傳空值'));
          return;
        }
        showToast(res.message || '同步完成');
        $('refreshBtn').click();
      }).catch(function (err) {
        done();
        showUpdated(view);
        alert('同步失敗：' + (err && err.message ? err.message : err));
      });
    });

    $('viewSwitch').addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (btn) setView(btn.dataset.view);
    });

    // ===== 手機通知(網頁推播;目前只有管理員)=====
    // iPhone:要先用 Safari「加入主畫面」、從主畫面圖示打開才支援(iOS 16.4 以上);Android / 電腦的 Chrome、Edge 直接可用
    const PUSH_SUPPORTED = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let pushSub = null;
    let pushBusy = false;

    function pushRegistration() {
      return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; });
    }

    function b64urlToBytes(s) {
      const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function renderPush(state) {
      const actions = $('pushActions');
      actions.innerHTML = '';
      $('pushBtn').classList.toggle('on', state === 'on');
      function button(label, cls, fn) {
        const b = el('button', 'btn btn-small ' + cls, label);
        b.type = 'button';
        b.disabled = pushBusy;
        b.addEventListener('click', fn);
        actions.appendChild(b);
      }
      const texts = {
        unsupported: IS_IOS
          ? 'iPhone 要先用 Safari 把這個網頁「加入主畫面」，再從主畫面的圖示打開，才能開啟通知（iOS 16.4 以上）。'
          : '這個瀏覽器不支援網頁通知，請改用 Chrome、Edge 或 Safari。',
        denied: '之前拒絕了通知權限。請到瀏覽器或手機設定裡，把這個網站的通知改成「允許」，再回來按一次開啟。',
        off: '還沒開啟。開啟後，有新訂單要處理時，這支手機會跳通知（內容只有筆數）。',
        on: '已開啟。有新訂單要處理時，這支手機會跳通知。',
        busy: '處理中…'
      };
      $('pushStatus').textContent = texts[state] || '';
      if (state === 'off' || state === 'denied') button('開啟通知', 'btn-primary', enablePush);
      if (state === 'on') {
        button('發測試通知', 'btn-secondary', testPush);
        button('關閉通知', 'btn-secondary', disablePush);
      }
    }

    // 讀這支手機目前的狀態;heal:登入時把已有的訂閱再送給伺服器一次(伺服器那邊被清掉時自動補回)
    function refreshPushState(heal) {
      if (!PUSH_SUPPORTED) { renderPush('unsupported'); return Promise.resolve(); }
      return pushRegistration().then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
        pushSub = sub && Notification.permission === 'granted' ? sub : null;
        renderPush(pushSub ? 'on' : (Notification.permission === 'denied' ? 'denied' : 'off'));
        if (heal && pushSub) gasCall('pushSubscribe', { subscription: pushSub.toJSON() }).catch(function () { /* 下次登入再試 */ });
      }).catch(function () { renderPush('unsupported'); });
    }

    function enablePush() {
      if (pushBusy) return;
      pushBusy = true;
      renderPush('busy');
      // 先要權限(iPhone 規定要在按下按鈕的當下要)
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') throw new Error(perm === 'denied' ? '沒有允許通知' : '沒有選擇允許通知');
        return Promise.all([gasCall('pushConfig'), pushRegistration()]);
      }).then(function (r) {
        const cfg = r[0];
        const reg = r[1];
        if (!cfg || !cfg.success || !cfg.publicKey) throw new Error((cfg && cfg.error) || '伺服器還沒設定網頁推播');
        // 舊的訂閱(例如伺服器換過金鑰)先退掉再重訂
        return reg.pushManager.getSubscription().then(function (old) { return old ? old.unsubscribe() : null; }).then(function () {
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(cfg.publicKey) });
        });
      }).then(function (sub) {
        return gasCall('pushSubscribe', { subscription: sub.toJSON() }).then(function (res) {
          if (!res || !res.success) {
            sub.unsubscribe();
            throw new Error(res ? res.error : '後端回傳空值');
          }
          pushSub = sub;
          return gasCall('pushTest', { endpoint: sub.endpoint });
        });
      }).then(function (res) {
        pushBusy = false;
        renderPush('on');
        showToast(res && res.success ? '已開啟通知，剛剛發了一則測試通知' : '已開啟通知，但測試通知沒送出：' + (res ? res.error : ''));
      }).catch(function (err) {
        pushBusy = false;
        alert('開啟通知失敗：' + (err && err.message ? err.message : err));
        refreshPushState();
      });
    }

    function testPush() {
      if (!pushSub || pushBusy) return;
      gasCall('pushTest', { endpoint: pushSub.endpoint }).then(function (res) {
        if (res && res.success) showToast('已送出測試通知，幾秒內這支手機會跳出來');
        else alert('測試通知失敗：' + (res ? res.error : '後端回傳空值'));
      }).catch(function (err) { alert('測試通知失敗：' + err.message); });
    }

    function disablePush() {
      if (!pushSub || pushBusy) return;
      if (!confirm('要關閉這支手機的新訂單通知嗎？')) return;
      pushBusy = true;
      renderPush('busy');
      const sub = pushSub;
      // 伺服器那邊刪不掉也沒關係:這支手機退訂後,下次推播會被推播服務退回,伺服器會自己清掉
      gasCall('pushUnsubscribe', { endpoint: sub.endpoint }).catch(function () { return null; })
        .then(function () { return sub.unsubscribe(); })
        .then(function () {
          pushBusy = false;
          pushSub = null;
          renderPush('off');
          showToast('已關閉這支手機的通知');
        }).catch(function (err) {
          pushBusy = false;
          alert('關閉通知失敗：' + (err && err.message ? err.message : err));
          refreshPushState();
        });
    }

    $('pushBtn').addEventListener('click', function () {
      const panel = $('pushPanel');
      panel.hidden = !panel.hidden;
      this.setAttribute('aria-expanded', String(!panel.hidden));
      if (!panel.hidden) refreshPushState();
    });

    // 點通知時網頁已經開著:service worker 請這裡打開寄信助手
    if (PUSH_SUPPORTED) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'openMail' && role === 'admin') setView('mail');
      });
    }

    // 管理員 / RC 在明細切換要看哪一位 AC
    $('acSelect').addEventListener('change', function () {
      const ac = this.value;
      if (!ac) return;
      loadOrders(ac);
      logAction('切換查看 AC', ac);
    });

    $('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const pw = $('pwInput').value.trim();
      if (!pw) {
        $('loginError').textContent = '請輸入密碼';
        return;
      }
      login(pw, false);
    });

    $('pwToggle').addEventListener('click', function () {
      const input = $('pwInput');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      this.innerHTML = svg(show ? 'eyeOff' : 'eye');
      this.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
    });

    $('logoutBtn').addEventListener('click', function () {
      if (!confirm('確定要登出嗎？下次需要重新輸入密碼。')) return;
      logAction('登出', '');
      showLogin('');
    });

    $('tabRow').addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (!btn || btn.dataset.tab === currentTab) return;
      setTab(btn.dataset.tab);
      logAction('切換分頁', currentTab === 'open' ? '未結案' : '已結案');
      renderCurrentTab();
    });

    $('searchInput').addEventListener('input', function () {
      searchKeyword = this.value.trim().toLowerCase();
      renderCurrentTab();
    });

    $('rcFilter').addEventListener('change', function () {
      reportFilter.rc = this.value;
      reportFilter.ac = '';
      rebuildAcFilter();
      renderReport();
    });

    $('acFilter').addEventListener('change', function () {
      reportFilter.ac = this.value;
      renderReport();
    });

    // 圖表 tooltip:滑鼠移上去或手指點一下顯示(只是輔助,數字在圖例與表格都看得到)
    document.addEventListener('pointerover', function (e) {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (t) showTip(t.dataset.tip, e.clientX, e.clientY);
    });
    document.addEventListener('pointermove', function (e) {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (t) showTip(t.dataset.tip, e.clientX, e.clientY);
    });
    document.addEventListener('pointerout', function (e) {
      if (e.target.closest && e.target.closest('[data-tip]')) $('tooltip').hidden = true;
    });
    window.addEventListener('scroll', function () { $('tooltip').hidden = true; }, { passive: true });

    function showTip(text, x, y) {
      const tip = $('tooltip');
      tip.textContent = text;
      tip.hidden = false;
      const half = tip.offsetWidth / 2 + 8;
      tip.style.left = Math.min(Math.max(x, half), window.innerWidth - half) + 'px';
      tip.style.top = Math.max(y, tip.offsetHeight + 16) + 'px';
    }

    // 記錄操作用的小工具:純粹記錄,失敗也不影響使用,所以不特別處理失敗情況
    // (後端依密碼決定記在誰名下;參數裡的 action/detail 改用 logAction/detail 避免跟
    //  gasCall 自己的 action 分派參數撞名)
    function logAction(action, detail) {
      if (!password) return;
      gasCall('logAcAction', { acEmail: currentAc, logAction: action, detail: detail || '' }).catch(function () { });
    }

    // ===== 登入 / 登出 =====
    // 身份由密碼決定:AC 只看自己名下訂單;RC 看自己負責的 AC(唯讀)+ 報表;管理員看全部 + 報表
    function login(pw, fromStorage) {
      sessionSeq++;
      password = pw;
      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = '驗證中…';
      $('loginError').textContent = '';

      // 第一頁要看的資料(AC 的訂單明細、管理員／RC 的報表)由登入一起帶回,不用再等一趟;
      // 開啟頁面的操作紀錄也由後端在登入時寫
      gasCall('login', {
        withInitial: location.hash === '#mail' ? 'none' : 'report',
        fromStorage: !!fromStorage
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = '登入';
        if (!res || !res.success) {
          $('loginError').textContent = res ? res.error : '後端回傳空值';
          return;
        }
        try { localStorage.setItem(PW_STORAGE_KEY, pw); } catch (e) { /* 存不進去就算了,下次再輸入一次 */ }
        $('pwInput').value = '';
        document.body.classList.remove('logged-out');
        role = res.role;

        // 「寄信助手」分頁只給管理員(後端也會擋)
        $('mailViewBtn').hidden = role !== 'admin';
        $('syncBtn').hidden = role !== 'admin';
        $('pushBtn').hidden = role !== 'admin';
        if (role === 'admin') refreshPushState(true);
        $('viewSwitch').classList.toggle('three', role === 'admin');

        if (role === 'ac') {
          // AC 主要工作是更新狀態,預設停在「訂單明細」;報表只含自己名下門市
          setIdentity(res.ac, '只會看到你名下門市的訂單');
          $('viewSwitchWrap').hidden = false;
          $('adminPicker').hidden = true;
          setView('detail', true);
          loadOrders(res.ac, res.initial && res.initial.orders);
        } else {
          if (role === 'admin') {
            setIdentity(res.name || '管理員', '管理員・可查看全部報表、訂單與寄信助手');
          } else {
            setIdentity(res.rc, 'RC・負責 ' + (res.acList || []).length + ' 位 AC（唯讀）');
          }
          fillAcSelect(res.acList || []);
          $('viewSwitchWrap').hidden = false;
          $('adminPicker').hidden = false;
          currentAc = '';
          $('acView').hidden = true;
          showState('list', '👆', '請選擇要查看的 AC', '從上方下拉選單選一位 AC');
          // 舊的寄信助手網址會轉到 #mail,管理員直接打開寄信助手
          initialReport = (res.initial && res.initial.report) || null;
          setView(role === 'admin' && location.hash === '#mail' ? 'mail' : 'report', true);
        }
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = '登入';
        $('loginError').textContent = err.message;
      });
    }

    function setIdentity(name, sub) {
      $('identityName').textContent = name;
      $('identitySub').textContent = sub;
      $('avatar').textContent = String(name || '?').trim().charAt(0).toUpperCase();
    }

    function showLogin(message) {
      sessionSeq++;
      abortInflight();
      password = '';
      role = '';
      currentAc = '';
      allOrders = [];
      reportOrders = null;
      reportOps = null;
      initialReport = null;
      // 畫面上已經顯示過的訂單、報表、信件內容也要清掉(只藏起來的話,用開發者工具還看得到)
      ['list', 'stats', 'reportBody', 'mailList', 'unassignedList'].forEach(function (id) { $(id).innerHTML = ''; });
      $('acSelect').innerHTML = '';
      $('toast-wrap').innerHTML = '';
      setIdentity('', '');
      reportFilter.period = 'all';
      reportFilter.rc = '';
      reportFilter.ac = '';
      showAllStores = false;
      Object.keys(updatedAt).forEach(function (k) { updatedAt[k] = ''; stale[k] = false; });
      resetMail();
      try { localStorage.removeItem(PW_STORAGE_KEY); } catch (e) { }
      clearTimeout(loadingTimeout);
      setStatus('');
      $('searchInput').value = '';
      searchKeyword = '';
      $('tooltip').hidden = true;
      // 手機通知的開關只給管理員:登出時收起來(這支手機的訂閱不動,要停收請先按「關閉通知」)
      $('pushPanel').hidden = true;
      $('pushBtn').hidden = true;
      $('pushBtn').setAttribute('aria-expanded', 'false');
      document.body.classList.add('logged-out');
      const btn = $('loginBtn');
      btn.disabled = false;
      btn.textContent = '登入';
      $('loginError').textContent = message || '';
    }

    function fillAcSelect(acList) {
      const select = $('acSelect');
      select.innerHTML = '';
      const placeholder = el('option', null, '請選擇要查看的 AC…');
      placeholder.value = '';
      select.appendChild(placeholder);
      acList.forEach(function (ac) {
        const opt = el('option', null, ac);
        opt.value = ac;
        select.appendChild(opt);
      });
    }

    function setView(v, silent) {
      view = v;
      document.querySelectorAll('#viewSwitch .seg-btn').forEach(function (b) {
        const on = b.dataset.view === v;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      $('reportView').hidden = v !== 'report';
      $('detailView').hidden = v !== 'detail';
      $('mailView').hidden = v !== 'mail';
      $('tooltip').hidden = true;
      window.scrollTo(0, 0);
      if (role === 'admin') {
        // 網址記住目前分頁,瀏覽器重新整理後還停在寄信助手
        try { history.replaceState(null, '', v === 'mail' ? '#mail' : location.pathname + location.search); } catch (e) { }
      }
      if (v === 'report') {
        if (!reportOrders || stale.report) loadReport();
        else showUpdated('report');
        if (!silent) logAction('查看報表', '');
      } else if (v === 'mail') {
        // 第一次切到寄信助手才讀資料,之後切回來沿用(按過重新整理才重抓)
        if (!mailLoaded || stale.mail) loadMail();
        else showUpdated('mail');
      } else {
        if (stale.detail && currentAc && !silent) loadOrders(currentAc);
        else showUpdated('detail');
      }
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('#tabRow .seg-btn').forEach(function (b) {
        const on = b.dataset.tab === currentTab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    // 從報表點某位 AC / 門市 / 訂單 → 切到明細並帶入搜尋字
    function openDetail(ac, search) {
      if (!ac) return;
      $('acSelect').value = ac;
      $('searchInput').value = search || '';
      searchKeyword = (search || '').trim().toLowerCase();
      setTab('open');
      autoTab = !!search;
      setView('detail', true);
      loadOrders(ac);
      logAction('從報表查看', ac + (search ? '(' + search + ')' : ''));
    }

    // ===== 畫面狀態:提示 / 載入中 / 錯誤 =====
    function stateEl(icon, title, text) {
      const st = el('div', 'state');
      st.appendChild(el('div', 'state-icon', icon));
      st.appendChild(el('div', 'state-title', title));
      if (text) st.appendChild(el('div', 'state-text', text));
      return st;
    }

    function showState(containerId, icon, title, text) {
      const box = $(containerId);
      box.innerHTML = '';
      box.appendChild(stateEl(icon, title, text));
    }

    function showSkeleton(containerId, count) {
      const box = $(containerId);
      box.innerHTML = '';
      for (let i = 0; i < (count || 3); i++) {
        const sk = el('div', 'skeleton');
        [40, 70, 55, 90].forEach(function (w) {
          const line = el('div', 'sk-line');
          line.style.width = w + '%';
          sk.appendChild(line);
        });
        box.appendChild(sk);
      }
    }

    function showError(containerId, message, retry) {
      const box = $(containerId);
      box.innerHTML = '';
      const err = el('div', 'error-box');
      err.setAttribute('role', 'alert');
      err.appendChild(el('strong', null, '發生錯誤'));
      err.appendChild(document.createTextNode(message));
      if (retry) {
        const btn = el('button', 'btn btn-secondary', '重試');
        btn.addEventListener('click', retry);
        err.appendChild(el('br'));
        err.appendChild(btn);
      }
      box.appendChild(err);
    }

    // 同一種資料連續讀兩次時(例如先看 A 再看 B),只採用最後一次;比較早送出、比較晚回來的直接忽略
    const reqSeq = {};
    function latestOnly(key) {
      const id = (reqSeq[key] = (reqSeq[key] || 0) + 1);
      return function (fn) {
        return function (x) { if (reqSeq[key] === id) return fn(x); };
      };
    }

    // =====================================================================
    // 訂單明細
    // =====================================================================
    // preloaded:登入時一起帶回的資料(有的話直接用,不再打 API)
    function loadOrders(acEmail, preloaded) {
      currentAc = acEmail;
      stale.detail = false;
      $('acView').hidden = false;
      const fresh = latestOnly('orders');
      if (preloaded) {
        fresh(onOrdersLoaded)(preloaded);
        return;
      }
      setStatus('載入中…');
      showSkeleton('list');
      clearTimeout(loadingTimeout);
      loadingTimeout = setTimeout(function () {
        setStatus('已等待超過 10 秒，仍在等待回應…');
      }, 10000);

      gasCall('getOrdersForAc', { ac: acEmail }).then(fresh(onOrdersLoaded)).catch(fresh(function (err) {
        clearTimeout(loadingTimeout);
        setStatus('載入失敗');
        showError('list', err.message, function () { loadOrders(acEmail); });
      }));
    }

    function onOrdersLoaded(result) {
      clearTimeout(loadingTimeout);
      if (!result || !result.success) {
        setStatus('載入失敗');
        showError('list', result ? result.error : '後端回傳空值', function () { loadOrders(currentAc); });
        return;
      }
      markUpdated('detail');
      allOrders = result.orders || [];
      if (autoTab) {
        autoTab = false;
        const hasOpen = allOrders.some(function (o) { return CLOSED_STATUSES.indexOf(o.status) === -1 && matchesSearch(o); });
        const hasClosed = allOrders.some(function (o) { return CLOSED_STATUSES.indexOf(o.status) !== -1 && matchesSearch(o); });
        if (!hasOpen && hasClosed) setTab('closed');
      }
      renderCurrentTab();
    }

    function matchesSearch(o) {
      if (!searchKeyword) return true;
      return [o.customer, o.storeName, o.phone, o.orderId].join(' ').toLowerCase().indexOf(searchKeyword) !== -1;
    }

    function isClosed(o) {
      return CLOSED_STATUSES.indexOf(o.status) !== -1;
    }

    function updateTabCounts() {
      const closed = allOrders.filter(isClosed).length;
      $('openTabCount').textContent = allOrders.length - closed;
      $('closedTabCount').textContent = closed;
    }

    function renderCurrentTab() {
      updateTabCounts();
      renderStats();
      const source = allOrders.filter(function (o) { return isClosed(o) === (currentTab === 'closed'); }).sort(byDiningDate);
      renderList(source.filter(matchesSearch));
    }

    // 儲存成功後只更新這一張卡片(不重畫整個清單),其他卡片還沒儲存的修改才不會被清掉
    function refreshSavedCard(order, card) {
      updateTabCounts();
      renderStats();
      if (!card || !card.isConnected) return;
      const stillHere = isClosed(order) === (currentTab === 'closed') && matchesSearch(order);
      if (stillHere) {
        card.replaceWith(buildCard(order));
        return;
      }
      // 結案 / 重新開啟後換到另一個分頁了:從這頁移除
      card.remove();
      if (!$('list').querySelector('.card')) renderList([]);
    }

    function renderStats() {
      const counts = {};
      STATUSES.forEach(function (s) { counts[s] = 0; });
      let wonSum = 0;
      let urgent = 0;
      allOrders.forEach(function (o) {
        if (counts[o.status] !== undefined) counts[o.status]++;
        if (o.status === STATUS_WON && o.dealAmount && !isNaN(Number(o.dealAmount))) wonSum += Number(o.dealAmount);
        if (o.status === STATUS_NOT_ORDERED && typeof o.daysUntil === 'number' && o.daysUntil <= 2) urgent++;
      });

      const extras = {};
      extras[STATUS_NOT_ORDERED] = urgent ? urgent + ' 筆將到期' : '';
      extras[STATUS_WON] = wonSum ? formatMoney(wonSum) : '';

      const box = $('stats');
      box.innerHTML = '';
      STATUSES.forEach(function (s) {
        const tile = el('div', 'stat ' + sClass(s));
        const lab = el('div', 'stat-label');
        lab.appendChild(el('span', 'dot'));
        lab.appendChild(document.createTextNode(label(s)));
        tile.appendChild(lab);
        tile.appendChild(el('div', 'stat-num', counts[s]));
        tile.appendChild(el('div', 'stat-extra', extras[s] || ' '));
        box.appendChild(tile);
      });
    }

    function renderList(orders) {
      const list = $('list');
      list.innerHTML = '';

      if (!orders.length) {
        if (searchKeyword) {
          showState('list', '🔍', '找不到符合的訂單', '試試其他關鍵字');
        } else if (currentTab === 'open') {
          showState('list', '🎉', '目前沒有未結案的訂單', '有新訂單時會出現在這裡');
        } else {
          showState('list', '📭', '目前沒有已結案的訂單', '標記「已成交」或「已流失」後會移到這裡');
        }
        return;
      }

      orders.forEach(function (o) { list.appendChild(buildCard(o)); });
    }

    // 用餐日期倒數標籤
    function dueTag(o) {
      if (typeof o.daysUntil !== 'number' || CLOSED_STATUSES.indexOf(o.status) !== -1) return null;
      const d = o.daysUntil;
      let text;
      if (d < 0) text = '已過 ' + Math.abs(d) + ' 天';
      else if (d === 0) text = '今天用餐';
      else if (d === 1) text = '明天用餐';
      else text = d + ' 天後用餐';
      const tag = el('span', 'tag' + (d < 0 ? ' late' : (d <= 2 ? ' soon' : '')));
      tag.appendChild(iconEl('clock', 'ic-sm'));
      tag.appendChild(document.createTextNode(text));
      return tag;
    }

    function statusPill(status) {
      const pill = el('span', 'pill ' + sClass(status));
      pill.appendChild(el('span', 'dot'));
      pill.appendChild(document.createTextNode(label(status)));
      return pill;
    }

    function metaItem(icon, lab, value, full) {
      const item = el('div', 'meta-item' + (full ? ' full' : ''));
      item.appendChild(iconEl(icon));
      const text = el('div');
      text.appendChild(el('div', 'meta-k', lab));
      text.appendChild(el('div', 'meta-v' + (hasValue(value) ? '' : ' muted'), hasValue(value) ? value : NO_VALUE_TEXT));
      item.appendChild(text);
      return item;
    }

    function buildCard(o) {
      const card = el('article', 'card ' + sClass(o.status));
      card.id = 'order-' + orderKey(o);

      const head = el('div', 'card-head');
      head.appendChild(statusPill(o.status));
      const due = dueTag(o);
      if (due) head.appendChild(due);
      card.appendChild(head);

      // 沒有顧客名稱時標題改用門市名,下面就不再重複顯示門市
      const hasCustomer = hasValue(o.customer);
      card.appendChild(el('h3', 'card-title', hasCustomer ? o.customer : o.storeName));
      if (hasCustomer) {
        const sub = el('div', 'card-sub');
        sub.appendChild(iconEl('store', 'ic-sm'));
        sub.appendChild(document.createTextNode(o.storeName));
        card.appendChild(sub);
      }
      if (o.orderId) card.appendChild(el('div', 'order-no', '訂單編號 ' + o.orderId));

      // 「待下單」且用餐日期逼近/已過期時,額外提示
      if (o.status === STATUS_NOT_ORDERED && typeof o.daysUntil === 'number' && o.daysUntil <= 2) {
        const overdue = o.daysUntil < 0;
        const alert = el('div', 'alert' + (overdue ? ' late' : ''));
        alert.appendChild(iconEl('alert', 'ic-sm'));
        alert.appendChild(el('span', null, overdue
          ? '用餐日期已過 ' + Math.abs(o.daysUntil) + ' 天，顧客仍未下單'
          : (o.daysUntil === 0 ? '今天就是用餐日，顧客仍未下單' : '用餐日期剩 ' + o.daysUntil + ' 天，顧客仍未下單')));
        card.appendChild(alert);
      }

      const meta = el('div', 'meta');
      const dateText = hasValue(o.diningDate)
        ? o.diningDate + (hasValue(o.timeSlot) ? '・' + o.timeSlot : '')
        : '';
      meta.appendChild(metaItem('calendar', '用餐日期', dateText, true));
      meta.appendChild(metaItem('users', '預計人數', o.people));
      meta.appendChild(metaItem('cash', '預算範圍', o.budget));
      meta.appendChild(metaItem('phone', '聯絡電話', o.phone, true));
      if (o.status === STATUS_WON && o.dealAmount) {
        meta.appendChild(metaItem('trophy', '成交金額', formatMoney(o.dealAmount)));
      }
      if (o.status === STATUS_WON && o.dealTime) {
        meta.appendChild(metaItem('check', '成交時間', o.dealTime));
      }
      card.appendChild(meta);

      // RC 只能看,不能改
      if (role === 'rc') {
        const note = el('div', 'readonly-note');
